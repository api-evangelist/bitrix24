      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                select:
                  type: array
                  items: {}
                  description: '|'
                filter:
                  type: object
                  description: '| An object for filtering the selected records in the format `{"field_1": "value_1", ... "field_N": "value_N"}`.'
                order:
                  type: object
                  description: '|'
                start:
                  type: integer
                  description: '| This parameter is used to manage pagination.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                select:
                  type: array
                  items: {}
                  description: '|'
                filter:
                  type: object
                  description: '| An object for filtering the selected records in the format `{"field_1": "value_1", ... "field_N": "value_N"}`.'
                order:
                  type: object
                  description: '|'
                start:
                  type: integer
                  description: '| This parameter is used to manage pagination.'
      responses:
