  /tasks.api.scrum.backlog.add:
    post:
      summary: Add backlog in Scrum tasks.api.scrum.backlog.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `tasks.api.scrum.backlog.add` adds a backlog in Scrum.'
      operationId: tasks_api_scrum_backlog_add
      tags:
      - Work Groups
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sonet-group/scrum/backlog/tasks-api-scrum-backlog-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing records about the group and user (detailed description provided below) in the following structure:'
                groupId:
                  type: integer
                  description: '| The identifier of the group for which the backlog is created.'
                createdBy:
                  type: integer
                  description: '| The ID of the user on whose behalf the backlog is created. If omitted, the backlog cannot be created ||'
                modifiedBy:
                  type: integer
                  description: '| The ID of the user who modified the backlog. If omitted, the method returns `0` ||'
              required:
              - fields
              - groupId
              - createdBy
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing records about the group and user (detailed description provided below) in the following structure:'
                groupId:
                  type: integer
                  description: '| The identifier of the group for which the backlog is created.'
                createdBy:
                  type: integer
                  description: '| The ID of the user on whose behalf the backlog is created. If omitted, the backlog cannot be created ||'
                modifiedBy:
                  type: integer
                  description: '| The ID of the user who modified the backlog. If omitted, the method returns `0` ||'
              required:
              - fields
              - groupId
              - createdBy
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - task
