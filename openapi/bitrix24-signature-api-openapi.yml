openapi: 3.2.0
info:
  title: Bitrix24 REST Signature API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Signature
paths:
  /humanresources.hcmlink.company.add:
    post:
      summary: Add HCM Link Company humanresources.hcmlink.company.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `humanresources.hcmlink.company.add` method adds a company from an HR system to the HCM Link integration.'
      operationId: humanresources_hcmlink_company_add
      tags:
      - Signature
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sign/hcm-link/humanresources-hcmlink-company-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Company data from the HR system (detailed description) ||'
                company:
                  type: string
                  description: '| Company code in the HR system ||'
                crmCompanyId:
                  type: integer
                  description: '| CRM company ID.'
                title:
                  type: string
                  description: '| Company name ||'
                data:
                  type: object
                  description: '| Additional company data ||'
                field:
                  type: string
                  description: '| Field code in the HR system ||'
                type:
                  type: string
                  description: '| Field type. If no value is passed, the method saves the field with the internal `UNKNOWN` type.'
                entityType:
                  type: string
                  description: '| Type of object the field belongs to. If no value is passed, the method saves the field with the internal `UNKNOWN` type.'
                ttl:
                  type: integer
                  description: '| Field value storage time in seconds.'
              required:
              - fields
              - company
              - crmCompanyId
              - title
              - field
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Company data from the HR system (detailed description) ||'
                company:
                  type: string
                  description: '| Company code in the HR system ||'
                crmCompanyId:
                  type: integer
                  description: '| CRM company ID.'
                title:
                  type: string
                  description: '| Company name ||'
                data:
                  type: object
                  description: '| Additional company data ||'
                field:
                  type: string
                  description: '| Field code in the HR system ||'
                type:
                  type: string
                  description: '| Field type. If no value is passed, the method saves the field with the internal `UNKNOWN` type.'
                entityType:
                  type: string
                  description: '| Type of object the field belongs to. If no value is passed, the method saves the field with the internal `UNKNOWN` type.'
                ttl:
                  type: integer
                  description: '| Field value storage time in seconds.'
              required:
              - fields
              - company
              - crmCompanyId
              - title
              - field
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - humanresources.hcmlink
