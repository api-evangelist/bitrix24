openapi: 3.2.0
info:
  title: Bitrix24 REST Events API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Events
paths:
  /event.bind:
    post:
      summary: Register a New Event Handler event.bind
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.bind` method registers a new event handler.'
      operationId: event_bind
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-bind.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: '| Event code, such as `ONCRMLEADADD`. The event must belong to the application''s scope or be a basic event; otherwise, the method returns the `ERROR_EVENT_NOT_FOUND` error. The list of available events is returned by the events method ||'
                handler:
                  type: string
                  description: '| Handler URL with the `http` or `https` scheme. The host name must contain a dot, so `localhost` is not accepted. Required for online events; ignored when `event_type=offline` ||'
                auth_type:
                  type: integer
                  description: '| Identifier of the user under whom the event handler is authorized. By default, for an administrator, it is the user whose action triggered the event; for a user without administrator rights, it is that user. Ignored when `event_type=offline` ||'
                event_type:
                  type: string
                  description: '| Subscription type: `online` or `offline`. Default is `online`. With `offline`, the event is placed in the offline event queue ||'
                auth_connector:
                  type: string
                  description: '| Source key for offline events. This key creates a separate queue that does not receive changes made by requests of the application itself with the same `auth_connector`. The same value is passed to the `event.offline.*` methods. The parameter is not available on all plans: check it with the fea...'
                options:
                  type: object
                  description: '| Additional settings for the registered event. The set of fields depends on the event.'
              required:
              - event
              - handler
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: '| Event code, such as `ONCRMLEADADD`. The event must belong to the application''s scope or be a basic event; otherwise, the method returns the `ERROR_EVENT_NOT_FOUND` error. The list of available events is returned by the events method ||'
                handler:
                  type: string
                  description: '| Handler URL with the `http` or `https` scheme. The host name must contain a dot, so `localhost` is not accepted. Required for online events; ignored when `event_type=offline` ||'
                auth_type:
                  type: integer
                  description: '| Identifier of the user under whom the event handler is authorized. By default, for an administrator, it is the user whose action triggered the event; for a user without administrator rights, it is that user. Ignored when `event_type=offline` ||'
                event_type:
                  type: string
                  description: '| Subscription type: `online` or `offline`. Default is `online`. With `offline`, the event is placed in the offline event queue ||'
                auth_connector:
                  type: string
                  description: '| Source key for offline events. This key creates a separate queue that does not receive changes made by requests of the application itself with the same `auth_connector`. The same value is passed to the `event.offline.*` methods. The parameter is not available on all plans: check it with the fea...'
                options:
                  type: object
                  description: '| Additional settings for the registered event. The set of fields depends on the event.'
              required:
              - event
              - handler
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /event.get:
    post:
      summary: Retrieve a List of Registered Event Handlers event.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.get` method returns a list of event handlers that the application registered with the event.bind method.'
      operationId: event_get
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /event.offline.clear:
    post:
      summary: Clear Offline Event Queue event.offline.clear
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.offline.clear` method deletes from the queue the records of a batch retrieved by the event.offline.get method with `clear=0`. This is how the application confirms that it has processed these records. Mark the records that could not be processed with the event.offline.error method. The batch workflow is described in the article {#T}.'
      operationId: event_offline_clear
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-offline-clear.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                process_id:
                  type: string
                  description: '| Identifier of the reserved event batch. It is returned by the event.offline.get method when called with the `clear=0` parameter. The value is also available in the `PROCESS_ID` field of the records returned by the event.offline.list method. Do not pass an empty string: the method does not retur...'
                id:
                  type: array
                  items: {}
                  description: '| Array of `ID` field values of the records to delete — integers greater than `0`. Ignored if the `message_id` parameter is passed. By default and when the array is empty, all records of the `process_id` batch are deleted ||'
                message_id:
                  type: array
                  items: {}
                  description: '| Array of `MESSAGE_ID` field values of the records to delete — strings of 32 characters. By default and when the array is empty, all records of the `process_id` batch are deleted ||'
                auth_connector:
                  type: string
                  description: '| Source key. Pass the same value with which the batch was retrieved by the `event.offline.get` method, otherwise the method deletes nothing. The parameter is not available on all plans: check it using the feature.get method with the code `rest_auth_connector`, otherwise the method returns the `W...'
              required:
              - process_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                process_id:
                  type: string
                  description: '| Identifier of the reserved event batch. It is returned by the event.offline.get method when called with the `clear=0` parameter. The value is also available in the `PROCESS_ID` field of the records returned by the event.offline.list method. Do not pass an empty string: the method does not retur...'
                id:
                  type: array
                  items: {}
                  description: '| Array of `ID` field values of the records to delete — integers greater than `0`. Ignored if the `message_id` parameter is passed. By default and when the array is empty, all records of the `process_id` batch are deleted ||'
                message_id:
                  type: array
                  items: {}
                  description: '| Array of `MESSAGE_ID` field values of the records to delete — strings of 32 characters. By default and when the array is empty, all records of the `process_id` batch are deleted ||'
                auth_connector:
                  type: string
                  description: '| Source key. Pass the same value with which the batch was retrieved by the `event.offline.get` method, otherwise the method deletes nothing. The parameter is not available on all plans: check it using the feature.get method with the code `rest_auth_connector`, otherwise the method returns the `W...'
              required:
              - process_id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /event.offline.error:
    post:
      summary: Register Offline Event Queue Processing Errors event.offline.error
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.offline.error` method marks records of a reserved offline event batch as erroneous. Such records are released from the reservation and are no longer included in the regular output of event.offline.get. You can retrieve them with the `event.offline.get` method with the `error=1` parameter.'
      operationId: event_offline_error
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-offline-error.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                process_id:
                  type: string
                  description: '| Identifier of the reserved event batch. It is returned by the event.offline.get method when called with the `clear=0` parameter ||'
                message_id:
                  type: array
                  items: {}
                  description: '| Array of `MESSAGE_ID` field values from the `event.offline.get` response — the keys of the records to mark as erroneous. A key is a string of 32 characters. The method does not check the length: with an invalid key, the record is not found and no error is returned. The method does not change re...'
                auth_connector:
                  type: string
                  description: '| Source key. Pass the same value with which the batch was retrieved by the `event.offline.get` method, otherwise the method does not find the records. The parameter is not available on all plans: check it using the feature.get method with the code `rest_auth_connector`, otherwise the method retu...'
              required:
              - process_id
              - message_id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                process_id:
                  type: string
                  description: '| Identifier of the reserved event batch. It is returned by the event.offline.get method when called with the `clear=0` parameter ||'
                message_id:
                  type: array
                  items: {}
                  description: '| Array of `MESSAGE_ID` field values from the `event.offline.get` response — the keys of the records to mark as erroneous. A key is a string of 32 characters. The method does not check the length: with an invalid key, the record is not found and no error is returned. The method does not change re...'
                auth_connector:
                  type: string
                  description: '| Source key. Pass the same value with which the batch was retrieved by the `event.offline.get` method, otherwise the method does not find the records. The parameter is not available on all plans: check it using the feature.get method with the code `rest_auth_connector`, otherwise the method retu...'
              required:
              - process_id
              - message_id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /event.offline.get:
    post:
      summary: Retrieve a List of Offline Events With Cleanup event.offline.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.offline.get` method returns to the application the first records from the offline event queue that match the filter. The method has two modes:'
      operationId: event_offline_get
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-offline-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Record filter. By default, the method returns all records. You can filter by the fields: `ID`, `TIMESTAMP_X`, `EVENT_NAME`, `MESSAGE_ID`.'
                order:
                  type: object
                  description: '| Record sorting by the same fields as in the filter, in the form `{"field": "ASC"}` or `{"field": "DESC"}`. Default is `{"TIMESTAMP_X": "ASC"}` ||'
                limit:
                  type: integer
                  description: '| Number of records to select, an integer greater than `0`. Default is 50 ||'
                clear:
                  type: integer
                  description: '| Whether to delete the selected records: `1` — delete immediately, `0` — reserve as a batch. Default is `1`. The value `0` without the `rest_offline_extended` mode returns the `WRONG_LICENSE` error ||'
                process_id:
                  type: string
                  description: '| Identifier of a previously reserved batch. Pass it to retrieve the batch records that have not been confirmed yet. With `clear=1`, the method deletes the entire batch, including records that were not included in the response due to `limit`. To keep the records, pass `clear=0` ||'
                auth_connector:
                  type: string
                  description: '| Source key. Pass the same `auth_connector` value as when subscribing with the event.bind method, otherwise the method returns only events without a source. The parameter is not available on all plans: check its availability using the feature.get method with the code `rest_auth_connector`, other...'
                error:
                  type: integer
                  description: '| `1` — return only records marked as erroneous by the event.offline.error method, `0` — only records without such a mark. Default is `0` ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Record filter. By default, the method returns all records. You can filter by the fields: `ID`, `TIMESTAMP_X`, `EVENT_NAME`, `MESSAGE_ID`.'
                order:
                  type: object
                  description: '| Record sorting by the same fields as in the filter, in the form `{"field": "ASC"}` or `{"field": "DESC"}`. Default is `{"TIMESTAMP_X": "ASC"}` ||'
                limit:
                  type: integer
                  description: '| Number of records to select, an integer greater than `0`. Default is 50 ||'
                clear:
                  type: integer
                  description: '| Whether to delete the selected records: `1` — delete immediately, `0` — reserve as a batch. Default is `1`. The value `0` without the `rest_offline_extended` mode returns the `WRONG_LICENSE` error ||'
                process_id:
                  type: string
                  description: '| Identifier of a previously reserved batch. Pass it to retrieve the batch records that have not been confirmed yet. With `clear=1`, the method deletes the entire batch, including records that were not included in the response due to `limit`. To keep the records, pass `clear=0` ||'
                auth_connector:
                  type: string
                  description: '| Source key. Pass the same `auth_connector` value as when subscribing with the event.bind method, otherwise the method returns only events without a source. The parameter is not available on all plans: check its availability using the feature.get method with the code `rest_auth_connector`, other...'
                error:
                  type: integer
                  description: '| `1` — return only records marked as erroneous by the event.offline.error method, `0` — only records without such a mark. Default is `0` ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /event.offline.list:
    post:
      summary: Get a List of Offline Events event.offline.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.offline.list` method reads the offline event queue of the application that called it. Unlike event.offline.get, it does not reserve records and does not return `process_id`. To confirm records or mark them as erroneous, retrieve them with the `event.offline.get` method with `clear=0`.'
      operationId: event_offline_list
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-offline-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Record filter. Without a filter, the method returns all records. You can filter by the fields: `ID`, `TIMESTAMP_X`, `EVENT_NAME`, `MESSAGE_ID`, `PROCESS_ID`, `ERROR`.'
                order:
                  type: object
                  description: '| Record sorting by the same fields as in the filter, in the form `{"field": "ASC"}` or `{"field": "DESC"}`. Default is `{"ID": "ASC"}` ||'
                start:
                  type: integer
                  description: '| This parameter is used to control pagination.'
                auth_connector:
                  type: string
                  description: '| Source key. The queue of offline events is divided by sources. Pass the same `auth_connector` value as when subscribing with the event.bind method; otherwise, the method will return only events without a source. The parameter is not available on all plans: check its availability using the featu...'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Record filter. Without a filter, the method returns all records. You can filter by the fields: `ID`, `TIMESTAMP_X`, `EVENT_NAME`, `MESSAGE_ID`, `PROCESS_ID`, `ERROR`.'
                order:
                  type: object
                  description: '| Record sorting by the same fields as in the filter, in the form `{"field": "ASC"}` or `{"field": "DESC"}`. Default is `{"ID": "ASC"}` ||'
                start:
                  type: integer
                  description: '| This parameter is used to control pagination.'
                auth_connector:
                  type: string
                  description: '| Source key. The queue of offline events is divided by sources. Pass the same `auth_connector` value as when subscribing with the event.bind method; otherwise, the method will return only events without a source. The parameter is not available on all plans: check its availability using the featu...'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /event.unbind:
    post:
      summary: Unregister Event Handler event.unbind
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `event.unbind` method deletes event handlers that the application registered with the event.bind method. BX24.js provides the BX24.callUnbind wrapper for this method.'
      operationId: event_unbind
      tags:
      - Events
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/events/event-unbind.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: '| Event code, for example `ONCRMLEADADD`. The code is case-insensitive ||'
                handler:
                  type: string
                  description: '| Handler URL specified at registration. Required for online events. With `event_type=offline`, the value is ignored ||'
                auth_type:
                  type: integer
                  description: '| User identifier under which the event handler is authorized. Without this parameter, an administrator deletes the handlers of all users, and a user without administrator rights deletes only their own. A user without administrator rights does not need to pass this parameter: if it is passed, onl...'
                event_type:
                  type: string
                  description: '| Subscription type: `online` or `offline`, case-insensitive. Defaults to `online`. With `offline`, the method works with offline events ||'
                auth_connector:
                  type: string
                  description: '| Source key. Applies only with `event_type=offline`: the method deletes offline handlers with the same `auth_connector` that was passed to event.bind. Without this parameter, the method deletes handlers that have no source key ||'
              required:
              - event
              - handler
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: '| Event code, for example `ONCRMLEADADD`. The code is case-insensitive ||'
                handler:
                  type: string
                  description: '| Handler URL specified at registration. Required for online events. With `event_type=offline`, the value is ignored ||'
                auth_type:
                  type: integer
                  description: '| User identifier under which the event handler is authorized. Without this parameter, an administrator deletes the handlers of all users, and a user without administrator rights deletes only their own. A user without administrator rights does not need to pass this parameter: if it is passed, onl...'
                event_type:
                  type: string
                  description: '| Subscription type: `online` or `offline`, case-insensitive. Defaults to `online`. With `offline`, the method works with offline events ||'
                auth_connector:
                  type: string
                  description: '| Source key. Applies only with `event_type=offline`: the method deletes offline handlers with the same `auth_connector` that was passed to event.bind. Without this parameter, the method deletes handlers that have no source key ||'
              required:
              - event
              - handler
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
components:
  schemas:
    BitrixError:
      type: object
      description: Bitrix24 REST API error response
      required:
      - error
      - error_description
      properties:
        error:
          type: string
          description: Error code
          example: ACCESS_DENIED
        error_description:
          type: string
          description: Human-readable error description
          example: Access denied.
    BitrixResponse:
      type: object
      description: Standard Bitrix24 REST API response
      properties:
        result:
          description: Method execution result
        total:
          type: integer
          description: Total number of records (for list methods)
        next:
          type: integer
          description: Next offset for pagination
        time:
          $ref: '#/components/schemas/BitrixTime'
    BitrixTime:
      type: object
      description: Request execution time information
      properties:
        start:
          type: number
          format: double
        finish:
          type: number
          format: double
        duration:
          type: number
          format: double
        processing:
          type: number
          format: double
        date_start:
          type: string
          format: date-time
        date_finish:
          type: string
          format: date-time
        operating_reset_at:
          type: integer
        operating:
          type: number
          format: double
  securitySchemes:
    AccessToken:
      type: apiKey
      in: query
      name: auth
      description: OAuth 2.0 access_token or incoming webhook token
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authorization
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.bitrix.info/oauth/authorize/
          tokenUrl: https://oauth.bitrix.info/oauth/token/
          scopes:
            crm: CRM — leads, deals, contacts, companies, smart processes
            task: Tasks and projects
            disk: Drive — files and folders
            im: Chats and notifications
            imbot: Chatbots
            imopenlines: Open Lines — messenger connectors
            telephony: Telephony
            sale: E-Commerce — orders, shipments
            catalog: Trade Catalog — products, prices
            calendar: Calendar
            bizproc: Business processes and robots
            user: Users
            department: Company structure
            timeman: Time tracking
            landing: Sites and landing pages
            pay_system: Payment systems
            cashbox: Online cash registers
            delivery: Delivery services
            documentgenerator: Document generator
            lists: Universal lists
            entity: Data storage
            log: News feed
            sonet_group: Workgroups and projects
            mailservice: Mail services
            messageservice: Message providers (SMS)
            biconnector: BIconnector — BI analytics
            ai_admin: CoPilot / AI
            sign.b2e: Signature — e-document signing
            vote: Polls and voting
            booking: Online booking
            userconsent: User consent agreements
            userfieldconfig: Custom field settings
            basic: Basic access
            placement: Widget placements
            rpa: Robots process automation
