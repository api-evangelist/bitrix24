        - user.userfield
  /user.userfield.file.get:
    post:
      summary: Get File from User Field user.userfield.file.get
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The page is hidden from the menu, and the method is not operational. Some data may be missing here — we will complete it shortly. - It may be necessary to list parameters or fields in a table.
      operationId: user_userfield_file_get
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-file-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user.userfield
  /user.userfield.list:
    post:
      summary: Get a list of custom fields user.userfield.list
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `user.userfield.list` retrieves a list of custom fields based on the filter.
      operationId: user_userfield_list
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: string
                  description: '\|`array` | Sorting of the selected custom fields in the format `{"field_1": "order_1", ... "field_N": "order_N"}`.'
                filter:
                  type: array
                  items: {}
                  description: '| Filter for the selected custom fields in the format `{"field_1": "value_1", ... "field_N": "value_N"}`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                order:
                  type: string
                  description: '\|`array` | Sorting of the selected custom fields in the format `{"field_1": "order_1", ... "field_N": "order_N"}`.'
                filter:
                  type: array
                  items: {}
                  description: '| Filter for the selected custom fields in the format `{"field_1": "value_1", ... "field_N": "value_N"}`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user.userfield
  /user.userfield.update:
    post:
      summary: Update User Field user.userfield.update
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `user.userfield.update` updates a user field.
      operationId: user_userfield_update
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-update.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '| Identifier of the user field.'
                fields:
                  type: object
                  description: '| Values of the fields to update the user field ||'
                XML_ID:
                  type: string
                  description: '| External code ||'
                SORT:
                  type: integer
                  description: '| Sort order ||'
                MANDATORY:
                  type: boolean
                  description: '| Whether the user field is mandatory. Possible values:'
                SHOW_FILTER:
                  type: boolean
                  description: '| Whether to show the field in the list filter. Possible values:'
                SHOW_IN_LIST:
                  type: boolean
                  description: '| Whether to show the field in the list. Possible values:'
                SETTINGS:
                  type: object
                  description: '| An object in the format `{"field_1": "value_1", ... "field_N": "value_N"}` for passing additional settings for user fields. Settings are described below ||'
                EDIT_FORM_LABEL:
                  type: string
                  description: '| Label in the edit form. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LIST_COLUMN_LABEL:
