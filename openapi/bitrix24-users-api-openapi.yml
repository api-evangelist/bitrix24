      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-file-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user.userfield
  /user.userfield.list:
    post:
      summary: Get a list of custom fields user.userfield.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `user.userfield.list` method retrieves a list of custom fields by filter.'
      operationId: user_userfield_list
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items: {}
                  description: '| Sorting of selected custom fields in `{"field_1": "order_1", ... "field_N": "order_N"}` format.'
                filter:
                  type: array
                  items: {}
                  description: '| Filter of selected custom fields in `{"field_1": "value_1", ... "field_N": "value_N"}` format.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                order:
                  type: array
                  items: {}
                  description: '| Sorting of selected custom fields in `{"field_1": "order_1", ... "field_N": "order_N"}` format.'
                filter:
                  type: array
                  items: {}
                  description: '| Filter of selected custom fields in `{"field_1": "value_1", ... "field_N": "value_N"}` format.'
      responses:
        '200':
          description: Successful response
          content:
