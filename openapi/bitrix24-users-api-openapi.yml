openapi: 3.0.3
info:
  title: Bitrix24 REST BIconnector Users API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Users
paths:
  /user.current:
    post:
      summary: Get Information About the Current User user.current
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `user.current` retrieves information about the [current](*current_key*) user. The list of user fields in Bitrix24 that will be obtained as a result of executing the method depends on the application's/webhook's scope. Details about user data access can be found in the [article](index.md). The method has no parameters. However, by making a REST request using data from `$_REQUEST` to the domain `DOMAIN` and adding `AUTH_ID` to the request for access to Bitrix24, you can find out which user opened the page in the context of Bitrix24.
      operationId: user_current
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/user-current.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| The root element of the response that contains information about the user ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| The root element of the response that contains information about the user ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user
  /user.fields:
    post:
      summary: Get User Fields user.fields
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The `user.fields` method allows you to retrieve a list of user field names. The method returns a standard list of fields, and the use of custom fields is not supported. The list of user fields in Bitrix24 that will be obtained as a result of executing the method depends on the application's/webhook's scope. Details about accessing user data can be found in the [article](index.md). Without parameters.
      operationId: user_fields
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/user-fields.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response containing user fields ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response containing user fields ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user
  /user.search:
    post:
      summary: Get a List of Users with Search by Personal Data user.search
      description: 'If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The `user.search` method allows you to retrieve a list of users with accelerated search based on personal data (first name, last name, patronymic, department name, job title). It operates in two modes: quickly using **Fulltext Index** and a slower option through [right LIKE](*key_right LIKE) (support is determined automatically). The list of user fields in Bitrix24 that will be returned as a result of executing the method depends on the application''s/webhook''s scope. Details about accessing user data can be found in the [article](index.md). The method inherits the behavior of the [user.get](./user-get.md) method, and all parameters from this function are also available.'
      operationId: user_search
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/user-search.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                FILTER:
                  type: string
                  description: '| The array can contain fields in any combination:'
                sort:
                  type: string
                  description: '| The field by which the results are sorted. Sorting works on all fields from user.add ||'
                order:
                  type: string
                  description: '| Sorting direction:'
                ADMIN_MODE:
                  type: boolean
                  description: '| Key for operation in administrator mode. Used to retrieve data about any users ||'
                start:
                  type: integer
                  description: '| This parameter is used for managing pagination.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                FILTER:
                  type: string
                  description: '| The array can contain fields in any combination:'
                sort:
                  type: string
                  description: '| The field by which the results are sorted. Sorting works on all fields from user.add ||'
                order:
                  type: string
                  description: '| Sorting direction:'
                ADMIN_MODE:
                  type: boolean
                  description: '| Key for operation in administrator mode. Used to retrieve data about any users ||'
                start:
                  type: integer
                  description: '| This parameter is used for managing pagination.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user
  /user.userfield.add:
    post:
      summary: Add Custom Field user.userfield.add
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `user.userfield.add` adds a custom field.
      operationId: user_userfield_add
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Values of the fields to add a new custom field ||'
                FIELD_NAME:
                  type: string
                  description: '| Name (code) of the field. Prefixed with `UF_USR_`'
                USER_TYPE_ID:
                  type: string
                  description: '| Type of the custom field. Possible values:'
                XML_ID:
                  type: string
                  description: '| External code ||'
                SORT:
                  type: integer
                  description: '| Sorting order ||'
                MULTIPLE:
                  type: boolean
                  description: '| Is the field multiple. Possible values:'
                MANDATORY:
                  type: boolean
                  description: '| Is the custom field mandatory. Possible values:'
                SHOW_FILTER:
                  type: boolean
                  description: '| Show the field in the list filter. Possible values:'
                SHOW_IN_LIST:
                  type: boolean
                  description: '| Show the field in the list. Possible values:'
                SETTINGS:
                  type: object
                  description: '| Object in the format `{"field_1": "value_1", ... "field_N": "value_N"}` for passing additional settings for custom fields. Settings are described below ||'
                EDIT_FORM_LABEL:
                  type: string
                  description: '| Label in the edit form. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LIST_COLUMN_LABEL:
                  type: string
                  description: '| Column header in the list. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LIST_FILTER_LABEL:
                  type: string
                  description: '| Filter header in the list. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                ERROR_MESSAGE:
                  type: string
                  description: '| Error message for invalid input. You can pass a string or an object with texts by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                HELP_MESSAGE:
                  type: string
                  description: '| Help text for the field. You can pass a string or an object with texts by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LABEL:
                  type: string
                  description: '| Default name of the custom field.'
              required:
              - fields
              - FIELD_NAME
              - USER_TYPE_ID
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Values of the fields to add a new custom field ||'
                FIELD_NAME:
                  type: string
                  description: '| Name (code) of the field. Prefixed with `UF_USR_`'
                USER_TYPE_ID:
                  type: string
                  description: '| Type of the custom field. Possible values:'
                XML_ID:
                  type: string
                  description: '| External code ||'
                SORT:
                  type: integer
                  description: '| Sorting order ||'
                MULTIPLE:
                  type: boolean
                  description: '| Is the field multiple. Possible values:'
                MANDATORY:
                  type: boolean
                  description: '| Is the custom field mandatory. Possible values:'
                SHOW_FILTER:
                  type: boolean
                  description: '| Show the field in the list filter. Possible values:'
                SHOW_IN_LIST:
                  type: boolean
                  description: '| Show the field in the list. Possible values:'
                SETTINGS:
                  type: object
                  description: '| Object in the format `{"field_1": "value_1", ... "field_N": "value_N"}` for passing additional settings for custom fields. Settings are described below ||'
                EDIT_FORM_LABEL:
                  type: string
                  description: '| Label in the edit form. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LIST_COLUMN_LABEL:
                  type: string
                  description: '| Column header in the list. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LIST_FILTER_LABEL:
                  type: string
                  description: '| Filter header in the list. You can pass a string or an object with labels by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                ERROR_MESSAGE:
                  type: string
                  description: '| Error message for invalid input. You can pass a string or an object with texts by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                HELP_MESSAGE:
                  type: string
                  description: '| Help text for the field. You can pass a string or an object with texts by languages in the format `{"de": "...", "en": "..."}`. When passing a string, the value will be set for all languages ||'
                LABEL:
                  type: string
                  description: '| Default name of the custom field.'
              required:
              - fields
              - FIELD_NAME
              - USER_TYPE_ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user.userfield
  /user.userfield.delete:
    post:
      summary: Delete User Field user.userfield.delete
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `user.userfield.delete` removes a user field.
      operationId: user_userfield_delete
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-delete.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '| Identifier of the user field.'
              required:
              - id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '| Identifier of the user field.'
              required:
              - id
      responses:
