  /user.userfield.update:
    post:
      summary: Update custom field user.userfield.update
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `user.userfield.update` method updates a custom field.'
      operationId: user_userfield_update
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-update.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: '| Custom field identifier.'
                fields:
                  type: object
                  description: '| Field values for updating the custom field ||'
                XML_ID:
                  type: string
                  description: '| External code ||'
                SORT:
                  type: integer
                  description: '| Sort order ||'
                MANDATORY:
                  type: boolean
                  description: '| Whether the custom field is mandatory. Possible values:'
                SHOW_FILTER:
                  type: boolean
                  description: '| Whether to show the field in the list filter. Possible values:'
                SHOW_IN_LIST:
                  type: boolean
                  description: '| Whether to show the field in the list. Possible values:'
                SETTINGS:
                  type: object
                  description: '| An object in `{"field_1": "value_1", ... "field_N": "value_N"}` format to pass additional custom field settings. Settings are described below ||'
                EDIT_FORM_LABEL:
                  type: string
                  description: '| Caption in the edit form. You can pass a string or an object with language-specific captions in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be applied to all languages ||'
                LIST_COLUMN_LABEL:
                  type: string
                  description: '| Column header in the list. You can pass a string or an object with language-specific captions in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be applied to all languages ||'
                LIST_FILTER_LABEL:
                  type: string
                  description: '| Filter header in the list. You can pass a string or an object with language-specific captions in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be applied to all languages ||'
                ERROR_MESSAGE:
                  type: string
                  description: '| Error message for invalid input. You can pass a string or an object with language-specific texts in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be applied to all languages ||'
                HELP_MESSAGE:
                  type: string
                  description: '| Tooltip text for the field. You can pass a string or an object with language-specific texts in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be applied to all languages ||'
                LABEL:
                  type: string
                  description: '| Default custom field name.'
              required:
