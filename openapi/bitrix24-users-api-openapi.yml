openapi: 3.2.0
info:
  title: Bitrix24 REST Users API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Users
paths:
  /user.current:
    post:
      summary: Get information about the current user user.current
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `user.current` retrieves information about the current user.'
      operationId: user_current
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/user-current.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response, which contains information about the user ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response, which contains information about the user ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user
  /user.fields:
    post:
      summary: Get user fields user.fields
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `user.fields` method allows you to retrieve a list of user field names. The method returns a standard list of fields; the use of custom fields is not supported.'
      operationId: user_fields
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/user-fields.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response, which contains custom fields ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response, which contains custom fields ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user
  /user.search:
    post:
      summary: Get a list of users with personal data search user.search
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation Searches for users by first name, last name, middle name, department name, and job title.'
      operationId: user_search
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/user-search.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                FILTER:
                  type: object
                  description: '| Object containing search fields (detailed description) ||'
                sort:
                  type: string
                  description: '| Field used to sort the results. Sorting works for all fields from user.add.'
                order:
                  type: string
                  description: '| Sorting direction:'
                ADMIN_MODE:
                  type: boolean
                  description: '| Enables administrator mode for retrieving user data. The parameter applies only when the request is made by an administrator.'
                select:
                  type: array
                  items: {}
                  description: '| An array with the names of the fields to return in the response. Without this parameter, the method returns all fields available to the application or webhook scope.'
                start:
                  type: integer
                  description: '| The parameter is used to manage pagination.'
                FIND:
                  type: string
                  description: '| Search string applied simultaneously to the first name, last name, middle name, job title, and department name ||'
                NAME:
                  type: string
                  description: '| User''s first name ||'
                LAST_NAME:
                  type: string
                  description: '| User''s last name ||'
                SECOND_NAME:
                  type: string
                  description: '| User''s middle name ||'
                WORK_POSITION:
                  type: string
                  description: '| User''s job title ||'
                UF_DEPARTMENT_NAME:
                  type: string
                  description: '| Department name ||'
                USER_TYPE:
                  type: string
                  description: '| User type. Possible values:'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                FILTER:
                  type: object
                  description: '| Object containing search fields (detailed description) ||'
                sort:
                  type: string
                  description: '| Field used to sort the results. Sorting works for all fields from user.add.'
                order:
                  type: string
                  description: '| Sorting direction:'
                ADMIN_MODE:
                  type: boolean
                  description: '| Enables administrator mode for retrieving user data. The parameter applies only when the request is made by an administrator.'
                select:
                  type: array
                  items: {}
                  description: '| An array with the names of the fields to return in the response. Without this parameter, the method returns all fields available to the application or webhook scope.'
                start:
                  type: integer
                  description: '| The parameter is used to manage pagination.'
                FIND:
                  type: string
                  description: '| Search string applied simultaneously to the first name, last name, middle name, job title, and department name ||'
                NAME:
                  type: string
                  description: '| User''s first name ||'
                LAST_NAME:
                  type: string
                  description: '| User''s last name ||'
                SECOND_NAME:
                  type: string
                  description: '| User''s middle name ||'
                WORK_POSITION:
                  type: string
                  description: '| User''s job title ||'
                UF_DEPARTMENT_NAME:
                  type: string
                  description: '| Department name ||'
                USER_TYPE:
                  type: string
                  description: '| User type. Possible values:'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user
  /user.userfield.add:
    post:
      summary: Add custom field user.userfield.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `user.userfield.add` method adds a custom field.'
      operationId: user_userfield_add
      tags:
      - Users
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/user/userfields/user-userfield-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Field values for adding a new custom field ||'
                FIELD_NAME:
                  type: string
                  description: '| Field name (code). Bitrix24 converts it to uppercase and supplements it with the `UF_USR_` prefix:'
                USER_TYPE_ID:
                  type: string
                  description: '| Custom field type. Possible values:'
                XML_ID:
                  type: string
                  description: '| External code ||'
                SORT:
                  type: integer
                  description: '| Sort order ||'
                MULTIPLE:
                  type: boolean
                  description: '| Whether the field is multiple. Possible values:'
                MANDATORY:
                  type: boolean
                  description: '| Whether the custom field is required. Possible values:'
                SHOW_FILTER:
                  type: boolean
                  description: '| Whether to show the field in the list filter. Possible values:'
                SHOW_IN_LIST:
                  type: boolean
                  description: '| Whether to show the field in the list. Possible values:'
                SETTINGS:
                  type: object
                  description: '| An object in `{"field_1": "value_1", ... "field_N": "value_N"}` format to pass additional custom field settings. Settings are described below ||'
                EDIT_FORM_LABEL:
                  type: string
                  description: '| Label in the editing form. You can pass a string or an object with labels by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                LIST_COLUMN_LABEL:
                  type: string
                  description: '| Column header in the list. You can pass a string or an object with labels by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                LIST_FILTER_LABEL:
                  type: string
                  description: '| Filter header in the list. You can pass a string or an object with labels by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                ERROR_MESSAGE:
                  type: string
                  description: '| Error message for invalid input. You can pass a string or an object with texts by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                HELP_MESSAGE:
                  type: string
                  description: '| Tooltip text for the field. You can pass a string or an object with texts by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                LABEL:
                  type: string
                  description: '| Default custom field name.'
              required:
              - fields
              - FIELD_NAME
              - USER_TYPE_ID
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Field values for adding a new custom field ||'
                FIELD_NAME:
                  type: string
                  description: '| Field name (code). Bitrix24 converts it to uppercase and supplements it with the `UF_USR_` prefix:'
                USER_TYPE_ID:
                  type: string
                  description: '| Custom field type. Possible values:'
                XML_ID:
                  type: string
                  description: '| External code ||'
                SORT:
                  type: integer
                  description: '| Sort order ||'
                MULTIPLE:
                  type: boolean
                  description: '| Whether the field is multiple. Possible values:'
                MANDATORY:
                  type: boolean
                  description: '| Whether the custom field is required. Possible values:'
                SHOW_FILTER:
                  type: boolean
                  description: '| Whether to show the field in the list filter. Possible values:'
                SHOW_IN_LIST:
                  type: boolean
                  description: '| Whether to show the field in the list. Possible values:'
                SETTINGS:
                  type: object
                  description: '| An object in `{"field_1": "value_1", ... "field_N": "value_N"}` format to pass additional custom field settings. Settings are described below ||'
                EDIT_FORM_LABEL:
                  type: string
                  description: '| Label in the editing form. You can pass a string or an object with labels by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                LIST_COLUMN_LABEL:
                  type: string
                  description: '| Column header in the list. You can pass a string or an object with labels by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                LIST_FILTER_LABEL:
                  type: string
                  description: '| Filter header in the list. You can pass a string or an object with labels by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                ERROR_MESSAGE:
                  type: string
                  description: '| Error message for invalid input. You can pass a string or an object with texts by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                HELP_MESSAGE:
                  type: string
                  description: '| Tooltip text for the field. You can pass a string or an object with texts by language in `{"de": "...", "en": "..."}` format. If a string is passed, the value will be set for all languages ||'
                LABEL:
                  type: string
                  description: '| Default custom field name.'
              required:
              - fields
              - FIELD_NAME
              - USER_TYPE_ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - user.userfield
  /user.userfield.delete:
    post:
      summary: Delete custom field user.userfield.delete
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `user.userfield.delete` method deletes a custom field.'
