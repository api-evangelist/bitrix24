      description: 'If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `imbot.v2.File.upload` uploads a file to the chat on behalf of the bot. It combines three steps of the deprecated API into a single call: uploading the file to the Drive, attaching it to the chat, and sending a message.'
      operationId: imbot_v2_File_upload
      tags:
      - Chatbots
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/chat-bots/chat-bots-v2/imbot.v2/files/file-upload.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                botId:
                  type: integer
                  description: '| Bot ID ||'
                botToken:
                  type: string
                  description: '| Unique authorization token for the bot. Required for webhook authorization, not needed for OAuth.'
                dialogId:
                  type: string
                  description: '| Dialog ID. For group chats — `chat{chatId}`, for personal chats — `{userId}` ||'
                fields:
                  type: object
                  description: '| File and message data. The structure is described below ||'
                name:
                  type: string
                  description: '| File name with extension ||'
                content:
                  type: string
                  description: '| File content in Base64 encoding. Maximum size — 100 MB ||'
                message:
                  type: string
                  description: '| Text message sent along with the file ||'
              required:
              - botId
              - dialogId
              - fields
              - name
              - content
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                botId:
                  type: integer
                  description: '| Bot ID ||'
                botToken:
                  type: string
                  description: '| Unique authorization token for the bot. Required for webhook authorization, not needed for OAuth.'
                dialogId:
                  type: string
                  description: '| Dialog ID. For group chats — `chat{chatId}`, for personal chats — `{userId}` ||'
                fields:
                  type: object
                  description: '| File and message data. The structure is described below ||'
                name:
                  type: string
                  description: '| File name with extension ||'
                content:
                  type: string
                  description: '| File content in Base64 encoding. Maximum size — 100 MB ||'
                message:
                  type: string
