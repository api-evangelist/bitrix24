                  description: '| Unique authorization token for the bot. Required for webhook authorization, not needed for OAuth.'
                fields:
                  type: object
                  description: '| Object with command parameters (detailed description) ||'
                command:
                  type: string
                  description: '| Command without the `/` symbol. For example: `help` ||'
