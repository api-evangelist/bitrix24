                  type: integer
                  description: '| Bot ID ||'
                botToken:
                  type: string
                  description: '| Unique authorization token for the bot. Required for webhook authorization, not needed for OAuth.'
                offset:
                  type: integer
                  description: '| Confirms all events with IDs less than the specified value. Not passed on the first call ||'
                limit:
                  type: integer
                  description: '| Maximum number of events returned (1–1000). Default is `100` ||'
                withUserEvents:
                  type: boolean
                  description: '| Include user events (`ONIMV2*`) in the response along with bot events. Default is `false`. More details — below ||'
