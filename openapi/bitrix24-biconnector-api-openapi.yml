                urlData:
                  type: string
                  description: '| New endpoint for obtaining data from the selected table, (detailed description)  ||'
                settings:
                  type: array
                  items: {}
                  description: '| New list of connection parameters, (detailed description) ||'
                sort:
                  type: integer
