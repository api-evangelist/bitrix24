      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/biconnector/connector/biconnector-connector-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                select:
                  type: string
                  description: '| List of fields to be filled in for the connectors in the selection. Allowed values are the field names from the selection element table and `*`. The `["*"]` value returns all fields and is also used by default ||'
                filter:
                  type: object
                  description: '| Filter for selecting connectors. Example format:'
                order:
                  type: object
                  description: '| Sorting parameters. Example format:'
                page:
                  type: integer
                  description: '| Number of the result page. Numbering starts at one, and the default value is 1. A non-numeric, zero, or negative value causes no error: the method silently returns the first page. The `start` parameter, common to most list methods of the REST API, does not work here ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
