  /biconnector.dataset.add:
    post:
      summary: Create Dataset biconnector.dataset.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation Development of the method has been discontinued. Use biconnector.table.add.'
