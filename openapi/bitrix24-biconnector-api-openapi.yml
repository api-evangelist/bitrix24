        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing data to create a new dataset. The object format:'
                name:
                  type: string
                  description: '| Dataset name. The name must start with a letter and may contain only lowercase Latin letters `a-z`, digits, and the `_` sign. The maximum name length is 230 characters ||'
                externalName:
                  type: string
                  description: '| Name of the dataset in the external source, in the application. The maximum length is 512 characters ||'
                externalCode:
                  type: string
                  description: '| Unique code of the dataset in the external source, used when selecting data. The maximum length is 512 characters ||'
                sourceId:
                  type: integer
                  description: '| Source identifier, can be obtained with the biconnector.source.list or biconnector.source.add method. The source must belong to the connector of the current application, otherwise the method returns `SOURCE_NOT_FOUND` ||'
                description:
                  type: string
                  description: '| Description of the dataset ||'
                type:
                  type: string
                  description: '| Data type of the field. Allowed values:'
