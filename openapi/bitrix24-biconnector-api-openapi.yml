openapi: 3.2.0
info:
  title: Bitrix24 REST B Iconnector API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: BIconnector
paths:
  /biconnector.connector.add:
    post:
      summary: Create Connector biconnector.connector.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `biconnector.connector.add` method creates a new connector.'
      operationId: biconnector_connector_add
      tags:
      - BIconnector
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/biconnector/connector/biconnector-connector-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing data to create a new connector. The object format:'
                title:
                  type: string
                  description: '| Connector name, maximum length is 512 characters ||'
                logo:
                  type: string
                  description: '| Connector logo. Can be provided as a link to an image or a base64 formatted string, for example `data:image/svg+xml;base64,PHN2ZyB3...` ||'
                description:
                  type: string
                  description: '| Connector description ||'
                urlCheck:
                  type: string
                  description: '| Connector endpoint for availability check, maximum length is 2048 characters, (detailed description) ||'
                urlTableList:
                  type: string
                  description: '| Connector endpoint for retrieving the list of tables, maximum length is 2048 characters, (detailed description) ||'
                urlTableDescription:
                  type: string
                  description: '| Connector endpoint for retrieving the description of a specific table, maximum length is 2048 characters, (detailed description) ||'
                urlData:
                  type: string
                  description: '| Connector endpoint for retrieving data from the selected table, maximum length is 2048 characters, (detailed description) ||'
                settings:
                  type: array
                  items: {}
                  description: '| Array of connection parameters: the codes and names of the fields whose values the user fills in when creating a source (detailed description) ||'
                supportMapping:
                  type: boolean
                  description: '| Support for mapping the table fields to the fields of the external system. The default value is `false`.'
                sourceCode:
                  type: string
                  description: '| String code of the external system, maximum length is 64 characters ||'
                sort:
                  type: integer
                  description: '| Connector sorting parameter. Default value is `100` ||'
                code:
                  type: string
                  description: '| Parameter code. The parameter goes to the external system under this name inside the `connection` object. Maximum length is 512 characters ||'
                name:
                  type: string
                  description: '| Parameter name that the user sees in the Analytics hub section. Maximum length is 512 characters ||'
                type:
                  type: string
                  description: '| Parameter type that determines the input field in the interface. Allowed values: `STRING`, `INT`. The value is case-sensitive: a lowercase `string` causes the `VALIDATION_SETTINGS_INVALID_TYPE` error ||'
              required:
              - fields
              - title
              - logo
              - urlCheck
              - urlTableList
              - urlTableDescription
              - urlData
              - settings
              - code
              - name
              - type
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing data to create a new connector. The object format:'
                title:
                  type: string
                  description: '| Connector name, maximum length is 512 characters ||'
                logo:
                  type: string
                  description: '| Connector logo. Can be provided as a link to an image or a base64 formatted string, for example `data:image/svg+xml;base64,PHN2ZyB3...` ||'
                description:
                  type: string
                  description: '| Connector description ||'
                urlCheck:
                  type: string
                  description: '| Connector endpoint for availability check, maximum length is 2048 characters, (detailed description) ||'
                urlTableList:
                  type: string
                  description: '| Connector endpoint for retrieving the list of tables, maximum length is 2048 characters, (detailed description) ||'
                urlTableDescription:
                  type: string
                  description: '| Connector endpoint for retrieving the description of a specific table, maximum length is 2048 characters, (detailed description) ||'
                urlData:
                  type: string
                  description: '| Connector endpoint for retrieving data from the selected table, maximum length is 2048 characters, (detailed description) ||'
                settings:
                  type: array
                  items: {}
                  description: '| Array of connection parameters: the codes and names of the fields whose values the user fills in when creating a source (detailed description) ||'
                supportMapping:
                  type: boolean
                  description: '| Support for mapping the table fields to the fields of the external system. The default value is `false`.'
                sourceCode:
                  type: string
                  description: '| String code of the external system, maximum length is 64 characters ||'
                sort:
                  type: integer
                  description: '| Connector sorting parameter. Default value is `100` ||'
                code:
                  type: string
                  description: '| Parameter code. The parameter goes to the external system under this name inside the `connection` object. Maximum length is 512 characters ||'
                name:
                  type: string
                  description: '| Parameter name that the user sees in the Analytics hub section. Maximum length is 512 characters ||'
                type:
                  type: string
                  description: '| Parameter type that determines the input field in the interface. Allowed values: `STRING`, `INT`. The value is case-sensitive: a lowercase `string` causes the `VALIDATION_SETTINGS_INVALID_TYPE` error ||'
              required:
              - fields
              - title
              - logo
              - urlCheck
              - urlTableList
              - urlTableDescription
              - urlData
              - settings
              - code
              - name
              - type
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - biconnector
