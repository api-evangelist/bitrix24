                IBLOCK_CODE:
                  type: string
                  description: '| Symbolic code of the information block.'
                ELEMENT_CODE:
                  type: string
                  description: '| Symbolic code of the element ||'
                FIELDS:
                  type: array
                  items: {}
                  description: '| Array of fields.'
                IBLOCK_SECTION_ID:
                  type: integer
                  description: '| Identifier of the section to which the element is added.'
                LIST_ELEMENT_URL:
