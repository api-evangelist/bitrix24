                FIELDS:
                  type: array
                  items: {}
                  description: '| Array of fields.'
                IBLOCK_SECTION_ID:
                  type: integer
                  description: '| Identifier of the section to which the element is added.'
                LIST_ELEMENT_URL:
                  type: string
                  description: '| Template address to the list elements.'
                NAME:
                  type: string
                  description: '| Name of the element ||'
                PROPERTY_PropertyId:
                  type: string
                  description: '| Custom properties.'
              required:
              - IBLOCK_TYPE_ID
              - IBLOCK_ID
              - IBLOCK_CODE
              - ELEMENT_CODE
              - FIELDS
              - NAME
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - lists
