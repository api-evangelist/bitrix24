  /timeman.timecontrol.settings.set:
    post:
      summary: Set Time Control Settings timeman.timecontrol.settings.set
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `timeman.timecontrol.settings.set` sets the configurations for the time control module. Data collection for time control begins once the corresponding registration settings are activated. It is not possible to retrieve data for the period prior to activation — the system does not retain historical information retrospectively.
      operationId: timeman_timecontrol_settings_set
      tags:
      - Time Management
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/timeman/timecontrol/timeman-timecontrol-settings-set.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ACTIVE:
                  type: boolean
                  description: '| Activate the time control module. Possible values:'
                MINIMUM_IDLE_FOR_REPORT:
                  type: integer
                  description: '| Minimum idle time in minutes after which a report is required ||'
                REGISTER_OFFLINE:
                  type: boolean
                  description: '| Register offline status ||'
                REGISTER_IDLE:
                  type: boolean
                  description: '| Register idle status ||'
                REGISTER_DESKTOP:
                  type: boolean
                  description: '| Register desktop application status ||'
                REPORT_REQUEST_TYPE:
                  type: string
                  description: '| Type of report requests. Possible values:'
                REPORT_REQUEST_USERS:
                  type: array
                  items: {}
                  description: '| Array of user IDs for whom report requests are required.'
                REPORT_SIMPLE_TYPE:
                  type: string
                  description: '| Type of simple report. Possible values:'
                REPORT_SIMPLE_USERS:
                  type: array
                  items: {}
                  description: '| Array of user IDs with access to the simple report.'
                REPORT_FULL_TYPE:
                  type: string
                  description: '| Type of full report. Possible values:'
                REPORT_FULL_USERS:
                  type: array
                  items: {}
                  description: '| Array of user IDs with access to the full report.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ACTIVE:
                  type: boolean
                  description: '| Activate the time control module. Possible values:'
                MINIMUM_IDLE_FOR_REPORT:
                  type: integer
                  description: '| Minimum idle time in minutes after which a report is required ||'
                REGISTER_OFFLINE:
                  type: boolean
                  description: '| Register offline status ||'
                REGISTER_IDLE:
                  type: boolean
                  description: '| Register idle status ||'
                REGISTER_DESKTOP:
                  type: boolean
                  description: '| Register desktop application status ||'
                REPORT_REQUEST_TYPE:
                  type: string
                  description: '| Type of report requests. Possible values:'
                REPORT_REQUEST_USERS:
                  type: array
                  items: {}
                  description: '| Array of user IDs for whom report requests are required.'
                REPORT_SIMPLE_TYPE:
                  type: string
                  description: '| Type of simple report. Possible values:'
                REPORT_SIMPLE_USERS:
                  type: array
                  items: {}
                  description: '| Array of user IDs with access to the simple report.'
                REPORT_FULL_TYPE:
                  type: string
                  description: '| Type of full report. Possible values:'
                REPORT_FULL_USERS:
                  type: array
                  items: {}
                  description: '| Array of user IDs with access to the full report.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - timeman
components:
  schemas:
    BitrixError:
      type: object
      description: Bitrix24 REST API error response
      required:
      - error
      - error_description
      properties:
        error:
          type: string
          description: Error code
          example: ACCESS_DENIED
        error_description:
          type: string
          description: Human-readable error description
          example: Access denied.
    BitrixTime:
      type: object
      description: Request execution time information
      properties:
        start:
          type: number
          format: double
        finish:
          type: number
          format: double
        duration:
          type: number
          format: double
        processing:
          type: number
          format: double
        date_start:
          type: string
          format: date-time
        date_finish:
          type: string
          format: date-time
        operating_reset_at:
          type: integer
        operating:
          type: number
          format: double
    BitrixResponse:
      type: object
      description: Standard Bitrix24 REST API response
      properties:
        result:
          description: Method execution result
        total:
          type: integer
          description: Total number of records (for list methods)
        next:
          type: integer
          description: Next offset for pagination
        time:
          $ref: '#/components/schemas/BitrixTime'
  securitySchemes:
    AccessToken:
      type: apiKey
      in: query
      name: auth
      description: OAuth 2.0 access_token or incoming webhook token
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authorization
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.bitrix.info/oauth/authorize/
          tokenUrl: https://oauth.bitrix.info/oauth/token/
          scopes:
            crm: CRM — leads, deals, contacts, companies, smart processes
            task: Tasks and projects
            disk: Drive — files and folders
            im: Chats and notifications
            imbot: Chatbots
            imopenlines: Open Lines — messenger connectors
            telephony: Telephony
            sale: E-Commerce — orders, shipments
            catalog: Trade Catalog — products, prices
            calendar: Calendar
            bizproc: Business processes and robots
            user: Users
            department: Company structure
            timeman: Time tracking
            landing: Sites and landing pages
            pay_system: Payment systems
            cashbox: Online cash registers
            delivery: Delivery services
            documentgenerator: Document generator
            lists: Universal lists
            entity: Data storage
            log: News feed
            sonet_group: Workgroups and projects
            mailservice: Mail services
            messageservice: Message providers (SMS)
            biconnector: BIconnector — BI analytics
            ai_admin: CoPilot / AI
            sign.b2e: Signature — e-document signing
            vote: Polls and voting
            booking: Online booking
            userconsent: User consent agreements
            userfieldconfig: Custom field settings
            basic: Basic access
