              properties:
                id:
                  type: integer
                  description: '| Identifier of the parent folder.'
                data:
                  type: object
                  description: '| Subfolder parameters (detailed description) ||'
                rights:
                  type: array
                  items: {}
                  description: '| An array of access permissions for the folder. Each item contains:'
