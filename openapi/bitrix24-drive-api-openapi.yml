        content:
          application/json:
            schema:
              type: object
              properties:
                QUERY:
                  type: string
                  description: '| Text of the search query.'
                TYPE:
                  type: string
                  description: '| Type of objects in the result:'
                FILTER:
                  type: object
                  description: '| Search scope (detailed description).'
                start:
                  type: integer
                  description: '| Offset for pagination.'
                STORAGE_ID:
                  type: integer
                  description: '| Optional key. Identifier of the storage to search in.'
                FOLDER_ID:
                  type: integer
                  description: '| Optional key. Identifier of the folder to search in. The search also covers nested folders, and the folder itself is not included in the result.'
