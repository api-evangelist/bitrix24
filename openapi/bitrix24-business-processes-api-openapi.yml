              properties:
                CODE:
                  type: string
                  description: '| Code of the robot that this application passed in `CODE` during registration. You can retrieve the codes using the bizproc.robot.list method ||'
              required:
              - CODE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - bizproc
  /bizproc.robot.list:
    post:
      summary: Get a list of registered application robots bizproc.robot.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `bizproc.robot.list` method returns a list of robots registered by the application.'
      operationId: bizproc_robot_list
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-robot/bizproc-robot-list.html
        description: Official Documentation
