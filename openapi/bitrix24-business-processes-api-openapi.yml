openapi: 3.2.0
info:
  title: Bitrix24 REST Business Processes API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Business Processes
paths:
  /bizproc.activity.add:
    post:
      summary: Add a New Action bizproc.activity.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `bizproc.activity.add` method adds a new action for use in workflows.'
      operationId: bizproc_activity_add
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-activity/bizproc-activity-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Internal identifier of the action. It is unique within the application.'
                HANDLER:
                  type: string
                  description: '| URL to which the action will send data via the Bitrix24 queue server.'
                AUTH_USER_ID:
                  type: integer
                  description: '| Identifier of the user whose token will be passed to the application ||'
                USE_SUBSCRIPTION:
                  type: boolean
                  description: '| Should the action wait for a response from the application? Possible values:'
                PROPERTIES:
                  type: object
                  description: '| Object with action parameters. Contains objects, each describing a parameter of the action.'
                RETURN_PROPERTIES:
                  type: object
                  description: '| Object with additional results of the action. Contains objects, each describing a parameter of the action.'
                DOCUMENT_TYPE:
                  type: array
                  items: {}
                  description: '| Document type that will determine the data types for the `PROPERTIES` and `RETURN_PROPERTIES` parameters. Consists of three string-type elements:'
                FILTER:
                  type: object
                  description: '| Object with rules for restricting the action by document type and edition.'
                USE_PLACEMENT:
                  type: boolean
                  description: '| Allows opening additional settings for the action in the application slider. Possible values:'
                PLACEMENT_HANDLER:
                  type: string
                  description: '| URL of the placement handler on the application side. Required if `USE_PLACEMENT = ''Y''` ||'
                Type:
                  type: string
                  description: '| Type of the parameter. Basic values:'
                Options:
                  type: array
                  items: {}
                  description: '| Array of values for the parameter of type list `''TYPE'': select''` like:'
                Required:
                  type: boolean
                  description: '| Parameter requirement. Possible values:'
                Multiple:
                  type: boolean
                  description: '| Parameter multiplicity. Possible values:'
                Default:
                  type: string
                  description: '| Default value of the parameter ||'
              required:
              - CODE
              - HANDLER
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Internal identifier of the action. It is unique within the application.'
                HANDLER:
                  type: string
                  description: '| URL to which the action will send data via the Bitrix24 queue server.'
                AUTH_USER_ID:
                  type: integer
                  description: '| Identifier of the user whose token will be passed to the application ||'
                USE_SUBSCRIPTION:
                  type: boolean
                  description: '| Should the action wait for a response from the application? Possible values:'
                PROPERTIES:
                  type: object
                  description: '| Object with action parameters. Contains objects, each describing a parameter of the action.'
                RETURN_PROPERTIES:
                  type: object
                  description: '| Object with additional results of the action. Contains objects, each describing a parameter of the action.'
                DOCUMENT_TYPE:
                  type: array
                  items: {}
                  description: '| Document type that will determine the data types for the `PROPERTIES` and `RETURN_PROPERTIES` parameters. Consists of three string-type elements:'
                FILTER:
                  type: object
                  description: '| Object with rules for restricting the action by document type and edition.'
                USE_PLACEMENT:
                  type: boolean
                  description: '| Allows opening additional settings for the action in the application slider. Possible values:'
                PLACEMENT_HANDLER:
                  type: string
                  description: '| URL of the placement handler on the application side. Required if `USE_PLACEMENT = ''Y''` ||'
                Type:
                  type: string
                  description: '| Type of the parameter. Basic values:'
                Options:
                  type: array
                  items: {}
                  description: '| Array of values for the parameter of type list `''TYPE'': select''` like:'
                Required:
                  type: boolean
                  description: '| Parameter requirement. Possible values:'
                Multiple:
                  type: boolean
                  description: '| Parameter multiplicity. Possible values:'
                Default:
                  type: string
                  description: '| Default value of the parameter ||'
              required:
              - CODE
              - HANDLER
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - bizproc
  /bizproc.activity.delete:
    post:
      summary: Delete Action bizproc.activity.delete
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `bizproc.activity.delete` method deletes an action for workflows that was added by the application.'
      operationId: bizproc_activity_delete
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-activity/bizproc-activity-delete.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Symbolic identifier of the application action ||'
              required:
              - CODE
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Symbolic identifier of the application action ||'
              required:
              - CODE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - bizproc
  /bizproc.activity.list:
    post:
      summary: Get a List of Application Actions bizproc.activity.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `bizproc.activity.list` method retrieves a list of actions set by the application.'
      operationId: bizproc_activity_list
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-activity/bizproc-activity-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - bizproc
  /bizproc.activity.log:
    post:
      summary: Write Information to the Business Process Log bizproc.activity.log
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `bizproc.activity.log` method logs information into the business process log. Event logging must be enabled in the business process template.'
      operationId: bizproc_activity_log
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-activity/bizproc-activity-log.html
        description: Official Documentation
      requestBody:
