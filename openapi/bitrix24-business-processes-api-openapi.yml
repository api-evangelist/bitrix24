  /bizproc.robot.add:
    post:
      summary: Register a New Automation Rule bizproc.robot.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `bizproc.robot.add` registers a new Automation rule.'
      operationId: bizproc_robot_add
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-robot/bizproc-robot-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Internal identifier of the Automation rule. It must be unique among the application''s Automation rules and workflow actions: if the application already has a workflow action with this `CODE`, the method returns the `ERROR_ACTIVITY_ALREADY_INSTALLED` error.'
                HANDLER:
                  type: string
                  description: '| Handler URL to which Bitrix24 sends the Automation rule data via the queue server.'
                AUTH_USER_ID:
                  type: integer
                  description: '| Identifier of the user whose token Bitrix24 passes to the handler by default. An administrator can select a different user in the Automation rule settings. If the parameter is not passed, no user is set ||'
                USE_SUBSCRIPTION:
                  type: boolean
                  description: '| Should the Automation rule wait for a response from the application? Possible values:'
                PROPERTIES:
                  type: object
                  description: '| Object with parameters of the Automation rule. Contains objects, each describing a parameter of the Automation rule.'
                RETURN_PROPERTIES:
                  type: object
                  description: '| Object with additional results of the Automation rule. Contains objects, each describing a parameter of the Automation rule.'
                DOCUMENT_TYPE:
                  type: array
                  items: {}
                  description: '| Document type that will determine the data types for the `PROPERTIES` and `RETURN_PROPERTIES` parameters. Consists of three string-type elements:'
                FILTER:
                  type: object
                  description: '| Object with rules to limit the Automation rule by document type and edition.'
                USE_PLACEMENT:
                  type: boolean
                  description: '| Allows opening additional settings for the Automation rule in the application slider. Possible values:'
                PLACEMENT_HANDLER:
                  type: string
                  description: '| URL of the placement handler on the application side. Required if `USE_PLACEMENT = ''Y''`. It is validated the same way as `HANDLER`. Each Automation rule and workflow action of the application must have its own URL ||'
                Type:
                  type: string
                  description: '| Type of the parameter. Basic values:'
                Options:
                  type: object
                  description: '| Options for a list-type parameter, `Type: ''select''`. The key is the option value, and the value is its title:'
                Required:
                  type: boolean
                  description: '| Parameter requirement. Possible values:'
                Multiple:
                  type: boolean
                  description: '| Parameter multiplicity. Possible values:'
                Default:
                  type: string
                  description: '| Default value of the parameter. For `Type = ''select''`, specify the key from `Options` ||'
              required:
              - CODE
              - HANDLER
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Internal identifier of the Automation rule. It must be unique among the application''s Automation rules and workflow actions: if the application already has a workflow action with this `CODE`, the method returns the `ERROR_ACTIVITY_ALREADY_INSTALLED` error.'
                HANDLER:
                  type: string
                  description: '| Handler URL to which Bitrix24 sends the Automation rule data via the queue server.'
                AUTH_USER_ID:
                  type: integer
                  description: '| Identifier of the user whose token Bitrix24 passes to the handler by default. An administrator can select a different user in the Automation rule settings. If the parameter is not passed, no user is set ||'
                USE_SUBSCRIPTION:
                  type: boolean
                  description: '| Should the Automation rule wait for a response from the application? Possible values:'
                PROPERTIES:
                  type: object
                  description: '| Object with parameters of the Automation rule. Contains objects, each describing a parameter of the Automation rule.'
                RETURN_PROPERTIES:
                  type: object
                  description: '| Object with additional results of the Automation rule. Contains objects, each describing a parameter of the Automation rule.'
                DOCUMENT_TYPE:
                  type: array
                  items: {}
                  description: '| Document type that will determine the data types for the `PROPERTIES` and `RETURN_PROPERTIES` parameters. Consists of three string-type elements:'
                FILTER:
                  type: object
                  description: '| Object with rules to limit the Automation rule by document type and edition.'
                USE_PLACEMENT:
                  type: boolean
                  description: '| Allows opening additional settings for the Automation rule in the application slider. Possible values:'
                PLACEMENT_HANDLER:
                  type: string
                  description: '| URL of the placement handler on the application side. Required if `USE_PLACEMENT = ''Y''`. It is validated the same way as `HANDLER`. Each Automation rule and workflow action of the application must have its own URL ||'
                Type:
                  type: string
                  description: '| Type of the parameter. Basic values:'
                Options:
                  type: object
                  description: '| Options for a list-type parameter, `Type: ''select''`. The key is the option value, and the value is its title:'
                Required:
                  type: boolean
                  description: '| Parameter requirement. Possible values:'
                Multiple:
                  type: boolean
                  description: '| Parameter multiplicity. Possible values:'
                Default:
                  type: string
                  description: '| Default value of the parameter. For `Type = ''select''`, specify the key from `Options` ||'
              required:
              - CODE
              - HANDLER
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - bizproc
  /bizproc.robot.delete:
    post:
