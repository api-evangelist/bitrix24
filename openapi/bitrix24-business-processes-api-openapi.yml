  /bizproc.robot.list:
    post:
      summary: Get a list of registered application robots bizproc.robot.list
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method returns a list of robots registered by the application. It works only in the context of the [application](../../../settings/app-installation/index.md). No parameters.
      operationId: bizproc_robot_list
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-robot/bizproc-robot-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: array
                  items: {}
                  description: '| List of application robot identifiers ||'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
