  /bizproc.event.send:
    post:
      summary: Return Parameters to Action or Automation Rule bizproc.event.send
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `bizproc.event.send` method returns the output parameters to the Automation rule or action that were specified during the registration or update of the Automation rule or action.'
      operationId: bizproc_event_send
      tags:
      - Business Processes
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/bizproc/bizproc-robot/bizproc-event-send.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                EVENT_TOKEN:
                  type: string
                  description: '| The run token of the Automation rule or action. Bitrix24 passes it to the application handler in the `event_token` field.'
                RETURN_VALUES:
                  type: object
                  description: '| Return values of the Automation rule or action. The keys are the parameter codes from `RETURN_PROPERTIES` that were set with the methods:'
                LOG_MESSAGE:
                  type: string
                  description: '| Text for the business process log.'
              required:
              - EVENT_TOKEN
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                EVENT_TOKEN:
                  type: string
                  description: '| The run token of the Automation rule or action. Bitrix24 passes it to the application handler in the `event_token` field.'
                RETURN_VALUES:
                  type: object
                  description: '| Return values of the Automation rule or action. The keys are the parameter codes from `RETURN_PROPERTIES` that were set with the methods:'
                LOG_MESSAGE:
