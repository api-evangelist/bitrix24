                  description: '| Document number ||'
                templateId:
                  type: integer
                  description: '| Template identifier ||'
                provider:
                  type: string
                  description: '| Provider class ||'
                value:
                  type: string
                  description: '| External identifier of the object ||'
                fileId:
                  type: integer
                  description: '| Identifier of the document''s DOCX file ||'
                imageId:
