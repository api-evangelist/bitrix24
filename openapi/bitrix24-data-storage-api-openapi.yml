openapi: 3.2.0
info:
  title: Bitrix24 REST Data Storage API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Data Storage
paths:
  /entity.add:
    post:
      summary: Create a Data Storage entity.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `entity.add` method creates a new data storage for the application.'
      operationId: entity_add
      tags:
      - Data Storage
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/entity/entities/entity-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ACCESS:
                  type: object
                  description: '| Access permissions in the format `{"access_code":"permission_level"}`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ACCESS:
                  type: object
                  description: '| Access permissions in the format `{"access_code":"permission_level"}`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - entity
  /entity.delete:
    post:
      summary: Delete a Storage entity.delete
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `entity.delete` method removes the application''s data store.'
      operationId: entity_delete
      tags:
      - Data Storage
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/entity/entities/entity-delete.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - entity
  /entity.get:
    post:
      summary: Get Storage Parameters or List of Storages entity.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `entity.get` method returns the parameters of the specified storage or a list of all storages of the application.'
      operationId: entity_get
      tags:
      - Data Storage
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/entity/entities/entity-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ENTITY:
                  type: string
                  description: '| Identifier of the application''s data storage. Use the value specified when creating the storage.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ENTITY:
                  type: string
                  description: '| Identifier of the application''s data storage. Use the value specified when creating the storage.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - entity
  /entity.item.add:
    post:
      summary: Add a Storage Item entity.item.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `entity.item.add` adds an item to the application''s data storage.'
      operationId: entity_item_add
      tags:
      - Data Storage
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/entity/items/entity-item-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                NAME:
                  type: string
                  description: '| Name of the storage item. ||'
                PROPERTY_VALUES:
                  type: object
                  description: '| Property values of the item in the format `{"PROPERTY_CODE": value}`.'
                SECTION:
                  type: integer
                  description: '| Identifier of the storage section. ||'
                DATE_ACTIVE_FROM:
                  type: string
                  format: date-time
                  description: '| Start date of the item''s activity. ||'
                DATE_ACTIVE_TO:
                  type: string
                  format: date-time
                  description: '| End date of the item''s activity. ||'
                PREVIEW_PICTURE:
                  type: string
                  description: '| Preview image of the item. File format is described in the article How to Upload Files. ||'
                DETAIL_PICTURE:
                  type: string
                  description: '| Detailed image of the item. File format is described in the article How to Upload Files. ||'
                UF_:
                  type: string
                  description: '| Custom fields of the item `UF_*`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                NAME:
                  type: string
                  description: '| Name of the storage item. ||'
                PROPERTY_VALUES:
                  type: object
                  description: '| Property values of the item in the format `{"PROPERTY_CODE": value}`.'
                SECTION:
                  type: integer
                  description: '| Identifier of the storage section. ||'
                DATE_ACTIVE_FROM:
                  type: string
                  format: date-time
                  description: '| Start date of the item''s activity. ||'
                DATE_ACTIVE_TO:
                  type: string
                  format: date-time
                  description: '| End date of the item''s activity. ||'
                PREVIEW_PICTURE:
                  type: string
                  description: '| Preview image of the item. File format is described in the article How to Upload Files. ||'
                DETAIL_PICTURE:
                  type: string
                  description: '| Detailed image of the item. File format is described in the article How to Upload Files. ||'
                UF_:
                  type: string
                  description: '| Custom fields of the item `UF_*`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - entity
