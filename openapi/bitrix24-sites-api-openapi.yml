                  type: object
                  description: '| Sorting in the format `{"FIELD": "ASC"}` or `{"FIELD": "DESC"}`. If the parameter is not passed, no special sorting is applied. ||'
                group:
                  type: array
                  items: {}
                  description: '| Grouping in ORM format. The method does not have a default value. ||'
                limit:
                  type: integer
                  description: '| Limit on the number of rows in the selection at the ORM level. The method does not set its own default limit. ||'
                offset:
                  type: integer
                  description: '| Offset for the selection at the ORM level. ||'
                get_preview:
