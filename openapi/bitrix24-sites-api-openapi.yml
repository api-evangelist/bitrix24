                scope:
                  type: string
                  description: '| Internal scope of the landing. It is not related to the REST scope `landing` in the method name.'
                fields:
                  type: object
                  description: '| Set of fields for the new page or folder (detailed description) ||'
                TITLE:
                  type: string
                  description: '| Title of the page ||'
                SITE_ID:
                  type: integer
                  description: '| Identifier of the site where the page is created.'
