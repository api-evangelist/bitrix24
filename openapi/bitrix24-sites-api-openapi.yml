            schema:
              type: object
              properties:
                scope:
                  type: string
                  description: '| Internal scope of the landings. It is not related to the REST scope `landing` in the method name.'
                params:
                  type: object
                  description: '| Parameters for selecting pages (detailed description) ||'
                select:
                  type: string
                  description: '| List of fields to select from Page Object Fields. If the parameter is not passed or is equal to `null`, `["*"]` is used.'
                filter:
                  type: object
                  description: '| Filter by fields from Page Object Fields. If the parameter is not passed or is in an incorrect format, the selection is performed without custom conditions. Keys with `.` and `CHECK_PERMISSIONS` are ignored.'
