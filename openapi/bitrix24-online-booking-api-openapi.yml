  /booking.v1.booking.list:
    post:
      summary: Get the list of bookings booking.v1.booking.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `booking.v1.booking.list` returns a filtered list of bookings. Each call returns one page with up to 50 bookings.'
      operationId: booking_v1_booking_list
      tags:
      - Online Booking
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/booking/booking/booking-v1-booking-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Object for filtering the list of bookings, description of available fields below ||'
                order:
                  type: object
                  description: '| Object for sorting the list of bookings. The sorting direction can take the following values:'
                start:
                  type: integer
                  description: '| Offset for pagination.'
                resourceId:
                  type: array
                  items: {}
                  description: '| Array of resource identifiers.'
                within:
                  type: object
                  description: '| Object for filtering by booking time in the format `{"dateFrom": "0", "dateTo": "1739262600"}`, where'
                createdWithin:
                  type: object
                  description: '| Object for filtering by booking creation date with the following required fields:'
                client:
                  type: object
                  description: '| Object for filtering by client.'
                id:
                  type: string
                  description: '| Sort by identifier ||'
                dateFrom:
                  type: string
                  description: '| Sort by start date ||'
                dateTo:
                  type: string
                  description: '| Sort by end date ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Object for filtering the list of bookings, description of available fields below ||'
                order:
                  type: object
                  description: '| Object for sorting the list of bookings. The sorting direction can take the following values:'
                start:
