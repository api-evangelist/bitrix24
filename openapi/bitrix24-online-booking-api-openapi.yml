                  type: string
                  description: '| Sort by identifier ||'
                dateFrom:
                  type: string
                  description: '| Sort by start date ||'
                dateTo:
                  type: string
                  description: '| Sort by end date ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
