openapi: 3.2.0
info:
  title: Bitrix24 REST Online Booking API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Online Booking
paths:
  /booking.v1.booking.add:
    post:
      summary: Add Booking booking.v1.booking.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `booking.v1.booking.add` adds a new booking for a resource.'
      operationId: booking_v1_booking_add
      tags:
      - Online Booking
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/booking/booking/booking-v1-booking-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing field values for creating a booking (detailed description) ||'
                resourceIds:
                  type: array
                  items: {}
                  description: '| An array of resource IDs for the booking.'
                name:
                  type: string
                  description: '| The name of the booking.'
                description:
                  type: string
                  description: '| The description of the booking.'
                datePeriod:
                  type: object
                  description: '| An object containing the booking time (detailed description) ||'
                from:
                  type: object
                  description: '| Booking start time. The structure is described below ||'
                to:
                  type: object
                  description: '| Booking end time. The structure is described below ||'
                timestamp:
                  type: integer
                  description: '| Date and time as a Unix timestamp. For example, `1723446900` ||'
                timezone:
                  type: string
                  description: '| Time zone as an IANA identifier. For example, `Europe/Berlin` ||'
              required:
              - fields
              - resourceIds
              - datePeriod
              - from
              - to
              - timestamp
              - timezone
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| An object containing field values for creating a booking (detailed description) ||'
                resourceIds:
                  type: array
                  items: {}
                  description: '| An array of resource IDs for the booking.'
                name:
                  type: string
                  description: '| The name of the booking.'
                description:
                  type: string
                  description: '| The description of the booking.'
                datePeriod:
                  type: object
                  description: '| An object containing the booking time (detailed description) ||'
                from:
                  type: object
                  description: '| Booking start time. The structure is described below ||'
                to:
                  type: object
                  description: '| Booking end time. The structure is described below ||'
                timestamp:
                  type: integer
                  description: '| Date and time as a Unix timestamp. For example, `1723446900` ||'
                timezone:
                  type: string
                  description: '| Time zone as an IANA identifier. For example, `Europe/Berlin` ||'
              required:
              - fields
              - resourceIds
              - datePeriod
              - from
              - to
              - timestamp
              - timezone
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - booking
