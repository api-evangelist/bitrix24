      summary: Set Connections for Booking booking.v1.booking.externalData.set
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `booking.v1.booking.externalData.set` replaces the entire set of connections for the specified booking.'
      operationId: booking_v1_booking_externalData_set
      tags:
      - Online Booking
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/booking/booking/external-data/booking-v1-booking-externaldata-set.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId:
                  type: integer
                  description: '| Booking identifier.'
                externalData:
                  type: array
                  items: {}
                  description: '| Complete set of booking connections. The new value replaces all existing connections. An empty array removes all connections. The object structure is described below ||'
                moduleId:
                  type: string
                  description: '| Module identifier, for example `crm` ||'
                entityTypeId:
                  type: string
                  description: '| Object type ID, for example `DEAL` ||'
                value:
