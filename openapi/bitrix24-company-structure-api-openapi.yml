openapi: 3.2.0
info:
  title: Bitrix24 REST Company Structure API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Company Structure
paths:
  /department.add:
    post:
      summary: Create Department department.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `department.add` adds a new department to the company''s structure.'
      operationId: department_add
      tags:
      - Company Structure
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/departments/department-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                NAME:
                  type: string
                  description: '| Department name ||'
                SORT:
                  type: integer
                  description: '| Department sorting field ||'
                PARENT:
                  type: integer
                  description: '| Identifier of the parent department ||'
                UF_HEAD:
                  type: integer
                  description: '| Identifier of the user who will become the head of the department ||'
              required:
              - NAME
              - PARENT
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                NAME:
                  type: string
                  description: '| Department name ||'
                SORT:
                  type: integer
                  description: '| Department sorting field ||'
                PARENT:
                  type: integer
                  description: '| Identifier of the parent department ||'
                UF_HEAD:
                  type: integer
                  description: '| Identifier of the user who will become the head of the department ||'
              required:
              - NAME
              - PARENT
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - department
  /department.delete:
