openapi: 3.2.0
info:
  title: Bitrix24 REST Tasks API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Tasks
paths:
  /documentation:
    post:
      summary: 'New Task Card: Overview of Changes'
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The new task card moved comments to the task chat. This page helps you choose the current REST methods for working with comments, files, events, results, and widgets after switching to the new card.'
      operationId: documentation
      tags:
      - Tasks
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/tasks/tasks-new.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                Condition:
                  type: string
                  description: '| Description ||'
                Identifier:
                  type: string
                  description: '| Returned Where | What It Is Used For ||'
                Operation:
                  type: string
                  description: '| Old Approach | Status in the New Card | New Approach ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                Condition:
                  type: string
                  description: '| Description ||'
                Identifier:
                  type: string
                  description: '| Returned Where | What It Is Used For ||'
                Operation:
                  type: string
                  description: '| Old Approach | Status in the New Card | New Approach ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
  /task.checklistitem.add:
    post:
      summary: Add Checklist Item with task.checklistitem.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `task.checklistitem.add` adds a new checklist item to a task.'
      operationId: task_checklistitem_add
      tags:
      - Tasks
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/tasks/checklist-item/task-checklist-item-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                TASKID:
                  type: integer
                  description: '| Task identifier.'
                FIELDS:
                  type: object
                  description: '| Object with checklist item fields ||'
                TITLE:
                  type: string
                  description: '| Text of the checklist item.'
                SORT_INDEX:
                  type: integer
                  description: '| Sort index. The lower the value, the higher the item in the list or sublist ||'
                IS_COMPLETE:
                  type: string
                  description: '| Status of the item. Possible values:'
                IS_IMPORTANT:
                  type: string
                  description: '| Mark indicating that the item is important. Possible values:'
                MEMBERS:
                  type: object
                  description: '| Object describing the participants of the checklist item. Key — user identifier, value — object with the participant type parameter `TYPE`. Possible participant type values:'
                PARENT_ID:
                  type: integer
                  description: '| Identifier of the parent item. Use for nested checklists.'
              required:
              - TASKID
              - FIELDS
              - TITLE
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                TASKID:
                  type: integer
                  description: '| Task identifier.'
                FIELDS:
                  type: object
                  description: '| Object with checklist item fields ||'
                TITLE:
                  type: string
                  description: '| Text of the checklist item.'
                SORT_INDEX:
                  type: integer
                  description: '| Sort index. The lower the value, the higher the item in the list or sublist ||'
                IS_COMPLETE:
                  type: string
                  description: '| Status of the item. Possible values:'
                IS_IMPORTANT:
                  type: string
                  description: '| Mark indicating that the item is important. Possible values:'
                MEMBERS:
                  type: object
                  description: '| Object describing the participants of the checklist item. Key — user identifier, value — object with the participant type parameter `TYPE`. Possible participant type values:'
                PARENT_ID:
                  type: integer
                  description: '| Identifier of the parent item. Use for nested checklists.'
              required:
              - TASKID
              - FIELDS
              - TITLE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - task
