openapi: 3.2.0
info:
  title: Bitrix24 REST Widgets API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Widgets
paths:
  /BX24.placement.bindEvent:
    post:
      summary: Set Up an Event Handler for the Interface BX24.placement.bindEvent
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `BX24.placement.bindEvent` sets an event handler for the interface. The event must be registered by the current placement, otherwise the subscription will not work.'
      operationId: BX24_placement_bindEvent
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/ui-interaction/bx24-placement-bind-event.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: '| The name of the event to which the handler subscribes ||'
                callback:
                  type: string
                  description: '| Callback function.'
              required:
              - event
              - callback
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: '| The name of the event to which the handler subscribes ||'
                callback:
                  type: string
                  description: '| Callback function.'
              required:
              - event
              - callback
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /BX24.placement.call:
    post:
      summary: Call the Registered Interface Command BX24.placement.call
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `BX24.placement.call` invokes an interface command registered by the current placement.'
      operationId: BX24_placement_call
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/ui-interaction/bx24-placement-call.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: '| The name of the command to invoke ||'
                parameters:
                  type: string
                  description: '| Passed parameters. The value type depends on the command: object, string, number, array, or `null`. Commands without parameters accept an empty object `{}` ||'
                callback:
                  type: string
                  description: '| Callback function. It receives the result of the command ||'
              required:
              - command
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                command:
                  type: string
                  description: '| The name of the command to invoke ||'
                parameters:
                  type: string
                  description: '| Passed parameters. The value type depends on the command: object, string, number, array, or `null`. Commands without parameters accept an empty object `{}` ||'
                callback:
                  type: string
                  description: '| Callback function. It receives the result of the command ||'
              required:
              - command
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /BX24.placement.getInterface:
    post:
      summary: Get Information About the JS Interface of the Current Placement…
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `BX24.placement.getInterface` retrieves information about the JS interface of the current placement: the list of available commands and events.'
      operationId: BX24_placement_getInterface
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/ui-interaction/bx24-placement-get-interface.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                callback:
                  type: string
                  description: '| Callback function. It receives an object with the fields `command` and `event` ||'
              required:
              - callback
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                callback:
                  type: string
                  description: '| Callback function. It receives an object with the fields `command` and `event` ||'
              required:
              - callback
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /BX24.placement.info:
    post:
      summary: Get the Widget Execution Context BX24.placement.info
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `BX24.placement.info` retrieves the handler call context: the code of the placement where the widget is open and the parameters passed along with it.'
      operationId: BX24_placement_info
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/ui-interaction/bx24-placement-info.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /placement.bind:
    post:
      summary: Register a Widget Handler placement.bind
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `placement.bind` adds a handler for the widget placement.'
      operationId: placement_bind
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/placement-bind.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                PLACEMENT:
                  type: string
                  description: '| Placement code. The method converts it to uppercase. The code must be available to the application under its scopes ||'
                HANDLER:
                  type: string
                  description: '| Widget handler URL. Specify an address with the `http` or `https` scheme and a host name containing a dot ||'
                TITLE:
                  type: string
                  description: '| Name of the widget in the interface. Depending on the placement, this may be the name of a tab in a form, a menu item, etc. ||'
                DESCRIPTION:
                  type: string
                  description: '| Description of the widget in the interface. Not used in practice ||'
                GROUP_NAME:
                  type: string
                  description: '| Allows grouping UI elements for multiple handlers of the same widget type. For example, several dropdown items in the top button of the CRM card. Supported only by certain types of widgets ||'
                LANG_ALL:
                  type: object
                  description: '| Object with `TITLE`, `DESCRIPTION`, and `GROUP_NAME` for the specified languages. If a nonempty `LANG_ALL` is passed, the method uses it instead of the corresponding top-level parameters. Users whose Bitrix24 interface uses one of these languages see localized names, descriptions, and groups:'
                OPTIONS:
                  type: object
                  description: '| Additional display parameters for the widget. Specific values depend on the placement. Currently used in widgets for messengers, in the widget `PAGE_BACKGROUND_WORKER`, and in the widget CRM_XXX_DETAIL_ACTIVITY'
                ICON:
                  type: object
                  description: '| Handler image. Pass `fileData` as an array containing the file name and its Base64-encoded content. The method stores the file as the registered handler''s icon ||'
                USER_ID:
                  type: integer
                  description: '| Identifier of the Bitrix24 user for whom the registered widget will be available. Possible values can be obtained using the user.get method.'
              required:
              - PLACEMENT
              - HANDLER
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                PLACEMENT:
                  type: string
                  description: '| Placement code. The method converts it to uppercase. The code must be available to the application under its scopes ||'
                HANDLER:
                  type: string
                  description: '| Widget handler URL. Specify an address with the `http` or `https` scheme and a host name containing a dot ||'
                TITLE:
                  type: string
                  description: '| Name of the widget in the interface. Depending on the placement, this may be the name of a tab in a form, a menu item, etc. ||'
                DESCRIPTION:
                  type: string
                  description: '| Description of the widget in the interface. Not used in practice ||'
                GROUP_NAME:
                  type: string
                  description: '| Allows grouping UI elements for multiple handlers of the same widget type. For example, several dropdown items in the top button of the CRM card. Supported only by certain types of widgets ||'
                LANG_ALL:
                  type: object
                  description: '| Object with `TITLE`, `DESCRIPTION`, and `GROUP_NAME` for the specified languages. If a nonempty `LANG_ALL` is passed, the method uses it instead of the corresponding top-level parameters. Users whose Bitrix24 interface uses one of these languages see localized names, descriptions, and groups:'
                OPTIONS:
                  type: object
                  description: '| Additional display parameters for the widget. Specific values depend on the placement. Currently used in widgets for messengers, in the widget `PAGE_BACKGROUND_WORKER`, and in the widget CRM_XXX_DETAIL_ACTIVITY'
                ICON:
                  type: object
                  description: '| Handler image. Pass `fileData` as an array containing the file name and its Base64-encoded content. The method stores the file as the registered handler''s icon ||'
                USER_ID:
                  type: integer
                  description: '| Identifier of the Bitrix24 user for whom the registered widget will be available. Possible values can be obtained using the user.get method.'
              required:
              - PLACEMENT
              - HANDLER
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
  /placement.get:
    post:
      summary: Get Handlers Registered by the Application placement.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `placement.get` returns the list of widget handlers that the application registered with the method placement.bind. For each handler, the method returns the embedding point code, the handler address, the user for whom the widget is registered, the settings, and the names in different languages.'
      operationId: placement_get
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/placement-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /placement.list:
    post:
      summary: Get Placements Available to the Application placement.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `placement.list` returns the placements available to the application.'
      operationId: placement_list
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/placement-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                SCOPE:
                  type: string
                  description: '| Limits the list to a specific application scope.'
                FULL:
                  type: boolean
                  description: '| Flag to retrieve the full list of placements.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                SCOPE:
                  type: string
                  description: '| Limits the list to a specific application scope.'
                FULL:
                  type: boolean
                  description: '| Flag to retrieve the full list of placements.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /placement.unbind:
    post:
      summary: Delete a Widget Handler placement.unbind
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `placement.unbind` removes the registered widget handler.'
      operationId: placement_unbind
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/placement-unbind.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                HANDLER:
                  type: string
                  description: '| URL of the widget handler.'
                USER_ID:
                  type: integer
                  description: '| Identifier of the Bitrix24 user for whom the handler was registered.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                HANDLER:
                  type: string
                  description: '| URL of the widget handler.'
                USER_ID:
                  type: integer
                  description: '| Identifier of the Bitrix24 user for whom the handler was registered.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /userfieldtype.add:
    post:
      summary: Register a New User Field Type userfieldtype.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `userfieldtype.add` method registers an application''s user field type and works only in the context of an application. After registration, create a field of this type using the userfieldconfig.add method: pass the full code `rest__` in `field.userTypeId`, where `APP_ID` is the application identifier from the app.info method. To create a field, the application also needs the `userfieldconfig` and `crm` scopes.'
      operationId: userfieldtype_add
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/user-field/userfieldtype-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                USER_TYPE_ID:
                  type: string
                  description: '| Type code. The method converts it to lowercase.'
                HANDLER:
                  type: string
                  description: '| Handler address that Bitrix24 loads into the field. It must start with `http://` or `https://`, and the host name must contain a dot.'
                TITLE:
                  type: string
                  description: '| Type name, up to 255 characters. Displayed in the administrative interface for configuring custom fields. If not passed, the type code becomes the name ||'
                DESCRIPTION:
                  type: string
                  description: '| Type description, up to 255 characters. Displayed in the administrative interface for configuring custom fields ||'
                OPTIONS:
                  type: object
                  description: '| Additional settings. Currently, one key is available: `height` — the field height in pixels, an integer.'
                LANG_ALL:
                  type: object
                  description: '| Type name and description for different languages. The object key is a two-letter language code, for example `ru` or `en`. The value is an object with the string fields `TITLE` and `DESCRIPTION`, up to 255 characters each. If a non-empty `LANG_ALL` is passed, the method ignores the `TITLE` and ...'
              required:
              - USER_TYPE_ID
              - HANDLER
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                USER_TYPE_ID:
                  type: string
                  description: '| Type code. The method converts it to lowercase.'
                HANDLER:
                  type: string
                  description: '| Handler address that Bitrix24 loads into the field. It must start with `http://` or `https://`, and the host name must contain a dot.'
                TITLE:
                  type: string
                  description: '| Type name, up to 255 characters. Displayed in the administrative interface for configuring custom fields. If not passed, the type code becomes the name ||'
                DESCRIPTION:
                  type: string
                  description: '| Type description, up to 255 characters. Displayed in the administrative interface for configuring custom fields ||'
                OPTIONS:
                  type: object
                  description: '| Additional settings. Currently, one key is available: `height` — the field height in pixels, an integer.'
                LANG_ALL:
                  type: object
                  description: '| Type name and description for different languages. The object key is a two-letter language code, for example `ru` or `en`. The value is an object with the string fields `TITLE` and `DESCRIPTION`, up to 255 characters each. If a non-empty `LANG_ALL` is passed, the method ignores the `TITLE` and ...'
              required:
              - USER_TYPE_ID
              - HANDLER
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /userfieldtype.delete:
    post:
      summary: Delete Registered User Field Type userfieldtype.delete
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `userfieldtype.delete` removes a user field type registered by this application and works only in the context of an application. To change the handler address, name, description, or field height, you do not need to delete the type — use the userfieldtype.update method.'
      operationId: userfieldtype_delete
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/user-field/userfieldtype-delete.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                USER_TYPE_ID:
                  type: string
                  description: '| Type code that the application passed to userfieldtype.add. The code is case-insensitive. You can retrieve the codes using the userfieldtype.list method ||'
              required:
              - USER_TYPE_ID
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                USER_TYPE_ID:
                  type: string
                  description: '| Type code that the application passed to userfieldtype.add. The code is case-insensitive. You can retrieve the codes using the userfieldtype.list method ||'
              required:
              - USER_TYPE_ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /userfieldtype.list:
    post:
      summary: Get a list of registered user field types userfieldtype.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `userfieldtype.list` returns the user field types that the application registered with the method userfieldtype.add. For each type, the method returns the code, the handler address, the name, and the description.'
      operationId: userfieldtype_list
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/user-field/userfieldtype-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: integer
                  description: '| Offset for pagination. The method returns no more than 50 records per call. To retrieve the next page, pass the `next` value from the previous response: `50` for the second page, `100` for the third. For details, see the article Features of List Methods ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                start:
                  type: integer
                  description: '| Offset for pagination. The method returns no more than 50 records per call. To retrieve the next page, pass the `next` value from the previous response: `50` for the second page, `100` for the third. For details, see the article Features of List Methods ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - placement
  /userfieldtype.update:
    post:
      summary: Change settings for user field type userfieldtype.update
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `userfieldtype.update` method modifies the settings of a user field type previously registered by the application. It updates the handler URL, name, description, and field height, but does not change the type code.'
      operationId: userfieldtype_update
      tags:
      - Widgets
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/widgets/user-field/userfieldtype-update.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                USER_TYPE_ID:
                  type: string
                  description: '| Short code of the previously registered user field type. Retrieve the code using userfieldtype.list | ||'
                HANDLER:
                  type: string
                  description: '| New handler URL for the user field type. Bitrix24 loads this URL in a frame within the field | Absolute URLs with the `http` or `https` protocol are allowed ||'
                TITLE:
                  type: string
                  description: '| Text name of the type. Will be displayed in the administrative interface for user field settings | ||'
                DESCRIPTION:
                  type: string
                  description: '| Text description of the type. Will be displayed in the administrative interface for user field settings | ||'
                OPTIONS:
                  type: object
                  description: '| Additional settings. Currently, one key is available: `height`—specifies the height of the user field in pixels. The value is converted to an integer.'
                LANG_ALL:
                  type: object
                  description: '| Type name and description for different languages. The object key is the language code, and the value is an object with the `TITLE` and `DESCRIPTION` fields | ||'
              required:
              - USER_TYPE_ID
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                USER_TYPE_ID:
                  type: string
                  description: '| Short code of the previously registered user field type. Retrieve the code using userfieldtype.list | ||'
                HANDLER:
                  type: string
                  description: '| New handler URL for the user field type. Bitrix24 loads this URL in a frame within the field | Absolute URLs with the `http` or `https` protocol are allowed ||'
                TITLE:
                  type: string
                  description: '| Text name of the type. Will be displayed in the administrative interface for user field settings | ||'
                DESCRIPTION:
                  type: string
                  description: '| Text description of the type. Will be displayed in the administrative interface for user field settings | ||'
                OPTIONS:
                  type: object
                  description: '| Additional settings. Currently, one key is available: `height`—specifies the height of the user field in pixels. The value is converted to an integer.'
                LANG_ALL:
                  type: object
                  description: '| Type name and description for different languages. The object key is the language code, and the value is an object with the `TITLE` and `DESCRIPTION` fields | ||'
              required:
              - USER_TYPE_ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
