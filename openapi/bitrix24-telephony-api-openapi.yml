openapi: 3.2.0
info:
  title: Bitrix24 REST Telephony API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Telephony
paths:
  /call.followup.field.get:
    post:
      summary: Get Follow-up Field Description call.followup.field.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method belongs to REST 3.0. Calling features and the response format of the new API version are described in the REST 3.0 Overview.'
      operationId: call_followup_field_get
      tags:
      - Telephony
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/telephony/follow-up/call-followup-field-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: '| The name of the Follow-up field for which the description needs to be obtained.'
                select:
                  type: array
                  items: {}
                  description: '| List of description fields to return in the response.'
              required:
              - name
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: '| The name of the Follow-up field for which the description needs to be obtained.'
                select:
                  type: array
                  items: {}
                  description: '| List of description fields to return in the response.'
              required:
              - name
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - call
  /call.followup.field.list:
    post:
      summary: Get Follow-up Fields List call.followup.field.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation This method belongs to REST 3.0. Details regarding the invocation features and response format of the new API version are described in the REST 3.0 Overview.'
      operationId: call_followup_field_list
      tags:
      - Telephony
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/telephony/follow-up/call-followup-field-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                select:
                  type: array
                  items: {}
                  description: '| List of description fields to return in the response.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                select:
                  type: array
                  items: {}
                  description: '| List of description fields to return in the response.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - call
  /call.followup.get:
    post:
      summary: Get Call Follow-up call.followup.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method belongs to REST 3.0. Calling features and the response format of the new API version are described in the REST 3.0 Overview.'
      operationId: call_followup_get
      tags:
      - Telephony
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/telephony/follow-up/call-followup-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                callId:
                  type: integer
                  description: '| Call identifier.'
                select:
                  type: array
                  items: {}
                  description: '| A list of fields and nested paths to be returned in the response.'
                mentionFormat:
                  type: string
                  description: '| Format for user mentions in AI text fields.'
              required:
              - callId
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                callId:
                  type: integer
                  description: '| Call identifier.'
                select:
                  type: array
                  items: {}
                  description: '| A list of fields and nested paths to be returned in the response.'
                mentionFormat:
                  type: string
                  description: '| Format for user mentions in AI text fields.'
              required:
              - callId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - call
  /call.followup.list:
    post:
      summary: Get a List of Follow-up Calls call.followup.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method belongs to REST 3.0. Details regarding call specifics and the response format of the new API version are described in the REST 3.0 Overview.'
      operationId: call_followup_list
      tags:
      - Telephony
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/telephony/follow-up/call-followup-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Selection criteria (detailed description) ||'
                select:
                  type: array
                  items: {}
                  description: '| List of fields and nested paths to be returned in the list items.'
                order:
                  type: object
                  description: '| Sorting parameters (detailed description).'
                pagination:
                  type: object
                  description: '| Cursor pagination parameters (detailed description) ||'
                mentionFormat:
                  type: string
                  description: '| Format of user mentions in text AI fields.'
                startDate:
                  type: object
                  description: '| Call start period (detailed description) ||'
                participantId:
                  type: integer
                  description: '| Call participant identifier.'
                from:
                  type: string
                  description: '| Period start in ISO 8601 format. For example: `2026-01-01T00:00:00Z` ||'
                to:
                  type: string
                  description: '| Period end in ISO 8601 format. The value must be greater than or equal to `from` ||'
                limit:
                  type: integer
                  description: '| Page size.'
                afterCursor:
                  type: object
                  description: '| Next page cursor. Pass the `afterCursor` value in its entirety from the previous response in the same format it was received (detailed description) ||'
                id:
                  type: integer
                  description: '| Identifier of the last item of the previous page ||'
              required:
              - filter
              - startDate
              - from
              - to
              - id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                filter:
                  type: object
                  description: '| Selection criteria (detailed description) ||'
                select:
                  type: array
                  items: {}
                  description: '| List of fields and nested paths to be returned in the list items.'
                order:
                  type: object
                  description: '| Sorting parameters (detailed description).'
                pagination:
                  type: object
                  description: '| Cursor pagination parameters (detailed description) ||'
                mentionFormat:
                  type: string
                  description: '| Format of user mentions in text AI fields.'
                startDate:
                  type: object
                  description: '| Call start period (detailed description) ||'
                participantId:
                  type: integer
                  description: '| Call participant identifier.'
                from:
                  type: string
                  description: '| Period start in ISO 8601 format. For example: `2026-01-01T00:00:00Z` ||'
                to:
                  type: string
                  description: '| Period end in ISO 8601 format. The value must be greater than or equal to `from` ||'
                limit:
                  type: integer
                  description: '| Page size.'
                afterCursor:
                  type: object
                  description: '| Next page cursor. Pass the `afterCursor` value in its entirety from the previous response in the same format it was received (detailed description) ||'
                id:
                  type: integer
                  description: '| Identifier of the last item of the previous page ||'
              required:
              - filter
              - startDate
              - from
              - to
              - id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - call
  /telephony.call.attachTranscription:
    post:
      summary: Add Transcription to Call with telephony.call.attachTranscription
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `telephony.call.attachTranscription` adds a transcription of the conversation to a completed call.'
      operationId: telephony_call_attachTranscription
      tags:
      - Telephony
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/telephony/telephony-call-attach-transcription.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CALL_ID:
                  type: string
                  description: '| Identifier of the call from the method telephony.externalCall.register ||'
                MESSAGES:
                  type: array
                  items: {}
                  description: '| Array of transcription utterances ||'
                COST:
                  type: number
                  format: double
                  description: '| Cost of the transcription.'
                COST_CURRENCY:
                  type: string
                  description: '| Currency of the transcription cost. Used only with `COST`.'
                SIDE:
                  type: string
                  description: '| Participant of the conversation.'
                START_TIME:
                  type: integer
                  description: '| Start time of the utterance in seconds from the beginning of the call.'
                STOP_TIME:
                  type: integer
                  description: '| End time of the utterance in seconds from the beginning of the call.'
                MESSAGE:
                  type: string
                  description: '| Text of the utterance ||'
              required:
              - CALL_ID
              - MESSAGES
              - SIDE
              - START_TIME
              - STOP_TIME
              - MESSAGE
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CALL_ID:
                  type: string
                  description: '| Identifier of the call from the method telephony.externalCall.register ||'
                MESSAGES:
                  type: array
                  items: {}
                  description: '| Array of transcription utterances ||'
                COST:
                  type: number
                  format: double
                  description: '| Cost of the transcription.'
                COST_CURRENCY:
                  type: string
                  description: '| Currency of the transcription cost. Used only with `COST`.'
                SIDE:
                  type: string
                  description: '| Participant of the conversation.'
                START_TIME:
                  type: integer
                  description: '| Start time of the utterance in seconds from the beginning of the call.'
                STOP_TIME:
                  type: integer
                  description: '| End time of the utterance in seconds from the beginning of the call.'
                MESSAGE:
                  type: string
                  description: '| Text of the utterance ||'
              required:
              - CALL_ID
              - MESSAGES
              - SIDE
              - START_TIME
              - STOP_TIME
              - MESSAGE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - telephony
  /telephony.externalCall.attachRecord:
    post:
      summary: Attach a Record to a Completed Call telephony.externalCall.attachRecord
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `telephony.externalCall.attachRecord` attaches a record to a completed call and to the CRM activity of the call.'
      operationId: telephony_externalCall_attachRecord
      tags:
      - Telephony
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/telephony/telephony-external-call-attach-record.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CALL_ID:
                  type: string
                  description: '| The identifier of the call from the method telephony.externalCall.register.'
                RECORD_URL:
                  type: string
                  description: '| The URL of the record on an external server. If this parameter is provided, Bitrix24 will download the file from the link.'
                FILENAME:
                  type: string
                  description: '| The name of the record file.'
                FILE_CONTENT:
                  type: string
                  description: '| The file in Base64 encoding. ||'
              required:
              - CALL_ID
              - RECORD_URL
              - FILENAME
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CALL_ID:
                  type: string
                  description: '| The identifier of the call from the method telephony.externalCall.register.'
                RECORD_URL:
                  type: string
                  description: '| The URL of the record on an external server. If this parameter is provided, Bitrix24 will download the file from the link.'
                FILENAME:
                  type: string
                  description: '| The name of the record file.'
                FILE_CONTENT:
                  type: string
                  description: '| The file in Base64 encoding. ||'
              required:
              - CALL_ID
              - RECORD_URL
