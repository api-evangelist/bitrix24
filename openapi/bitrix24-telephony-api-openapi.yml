                  type: string
                  description: '| The new name of the external line. ||'
                CRM_AUTO_CREATE:
                  type: string
                  description: '| Auto-creation of a CRM object for outgoing calls.'
              required:
              - NUMBER
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                NUMBER:
                  type: string
