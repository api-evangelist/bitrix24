openapi: 3.2.0
info:
  title: Bitrix24 REST General Methods API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: General Methods
paths:
  /access.name:
    post:
      summary: Get Access Code Names access.name
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `access.name` retrieves the names of access codes. Access codes identify users, departments, groups, and other permission subjects, for example, in the user.access method.'
      operationId: access_name
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/access-name.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ACCESS:
                  type: string
                  description: '| List of access codes for which names need to be retrieved, for example `["U1", "D107"]`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ACCESS:
                  type: string
                  description: '| List of access codes for which names need to be retrieved, for example `["U1", "D107"]`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /app.info:
    post:
      summary: Show information about the app app.info
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `app.info` returns information about the application: its status, version, payment period, and Bitrix24 plan. See also the response when called via a webhook.'
      operationId: app_info
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/app-info.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /app.option.get:
    post:
      summary: Retrieve General Application Settings app.option.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `app.option.get` retrieves general application settings saved via app.option.set. The settings are the same for all Bitrix24 users.'
      operationId: app_option_get
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/settings/app-option-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                option:
                  type: string
                  description: '| One of the keys saved by the app.option.set method.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                option:
                  type: string
                  description: '| One of the keys saved by the app.option.set method.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /app.option.set:
    post:
      summary: Save General Application Settings app.option.set
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `app.option.set` method saves general application settings, which are the same for all Bitrix24 users. You can read them with the app.option.get method.'
      operationId: app_option_set
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/settings/app-option-set.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: object
                  description: '| An object of settings: the key is the setting name, and the value is its value. Pass `options` as an object. Do not use the keys `next` and `total`: when all settings are read, the REST API returns them in the root of the response rather than in `result`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                options:
                  type: object
                  description: '| An object of settings: the key is the setting name, and the value is its value. Pass `options` as an object. Do not use the keys `next` and `total`: when all settings are read, the REST API returns them in the root of the response rather than in `result`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /feature.get:
    post:
      summary: Get Information on Feature Availability in Bitrix24 feature.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `feature.get` checks whether a REST API feature is available in a specific Bitrix24. Availability depends on the plan, so check it before using the feature in your application.'
      operationId: feature_get
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/feature-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Feature code. Available codes:'
              required:
              - CODE
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CODE:
                  type: string
                  description: '| Feature code. Available codes:'
              required:
              - CODE
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /method.get:
    post:
      summary: Check Method Availability method.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `method.get` method checks whether a method exists in Bitrix24 and whether it can be called with the current scopes.'
      operationId: method_get
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/method-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: '| The name of the method to check, for example `user.get`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: '| The name of the method to check, for example `user.get`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /methods:
    post:
      summary: Get a List of Available Methods
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `methods` method retrieves a list of available methods.'
      operationId: methods
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/methods.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  description: '| If you pass `true`, the method returns the methods of all Bitrix24 scopes, not only those available to the application.'
                scope:
                  type: string
                  description: '| The code of the scope whose methods to retrieve, for example, `user` or `crm`. The codes are listed on the available scopes page.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  description: '| If you pass `true`, the method returns the methods of all Bitrix24 scopes, not only those available to the application.'
                scope:
                  type: string
                  description: '| The code of the scope whose methods to retrieve, for example, `user` or `crm`. The codes are listed on the available scopes page.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /profile:
    post:
      summary: Get Basic Information About the Current User Profile
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `profile` method retrieves basic information about the current user. Unlike user.current, it does not require a separate scope.'
      operationId: profile
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/users/profile.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /scope:
    post:
      summary: Get a List of Available Permissions Scope
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `scope` method returns a list of scopes — the permissions granted to the application or webhook.'
      operationId: scope
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/scope.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  description: '| If you pass `true`, the method returns all scopes available in this Bitrix24, regardless of the application''s permissions. The set depends on the installed modules.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                full:
                  type: boolean
                  description: '| If you pass `true`, the method returns all scopes available in this Bitrix24, regardless of the application''s permissions. The set depends on the installed modules.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /server.time:
    post:
      summary: Get Current Server Time server.time
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `server.time` returns the current Bitrix24 server time in the ISO 8601 format `YYYY-MM-DDThh:mm:ss±hh:mm`.'
      operationId: server_time
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/system/server-time.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /user.access:
    post:
      summary: Check User Access Codes user.access
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The `user.access` method checks if the current user has at least one of the access codes passed in the `ACCESS` parameter.'
      operationId: user_access
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/users/user-access.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ACCESS:
                  type: string
                  description: \|`string` | List of access codes to check, for example `["D1", "SG1_K"]`. A single code can be passed as a string, for example `"D1"`.
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ACCESS:
                  type: string
                  description: \|`string` | List of access codes to check, for example `["D1", "SG1_K"]`. A single code can be passed as a string, for example `"D1"`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /user.admin:
    post:
      summary: Check Administrator Permissions user.admin
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `user.admin` checks whether the current user is a Bitrix24 administrator.'
      operationId: user_admin
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/users/user-admin.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /user.option.get:
    post:
      summary: Retrieve User Settings user.option.get
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `user.option.get` retrieves the current user''s settings saved by the application via user.option.set. Each user sees only their own values. The method does not return other users'' settings; general application settings are read by the app.option.get method.'
      operationId: user_option_get
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/settings/user-option-get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                option:
                  type: string
                  description: '| One of the keys saved by the user.option.set method.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                option:
                  type: string
                  description: '| One of the keys saved by the user.option.set method.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
  /user.option.set:
    post:
      summary: Save User Settings user.option.set
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `user.option.set` saves the current user''s settings for the application. Each user stores their own values. You can read them with the user.option.get method.'
      operationId: user_option_set
      tags:
      - General Methods
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/common/settings/user-option-set.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: object
                  description: '| An object of settings: the key is the setting name, and the value is its value. Pass `options` as an object. Do not use the keys `next` and `total`: when all settings are read, the REST API returns them in the root of the response rather than in `result`.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                options:
                  type: object
                  description: '| An object of settings: the key is the setting name, and the value is its value. Pass `options` as an object. Do not use the keys `next` and `total`: when all settings are read, the REST API returns them in the root of the response rather than in `result`.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - basic
components:
  schemas:
    BitrixError:
      type: object
      description: Bitrix24 REST API error response
      required:
      - error
      - error_description
      properties:
        error:
          type: string
          description: Error code
          example: ACCESS_DENIED
        error_description:
          type: string
          description: Human-readable error description
          example: Access denied.
    BitrixResponse:
      type: object
      description: Standard Bitrix24 REST API response
      properties:
        result:
          description: Method execution result
        total:
          type: integer
          description: Total number of records (for list methods)
        next:
          type: integer
          description: Next offset for pagination
        time:
          $ref: '#/components/schemas/BitrixTime'
    BitrixTime:
      type: object
      description: Request execution time information
      properties:
        start:
          type: number
          format: double
        finish:
          type: number
          format: double
        duration:
          type: number
          format: double
        processing:
          type: number
          format: double
        date_start:
          type: string
          format: date-time
        date_finish:
          type: string
          format: date-time
        operating_reset_at:
          type: integer
        operating:
          type: number
          format: double
  securitySchemes:
    AccessToken:
      type: apiKey
      in: query
      name: auth
      description: OAuth 2.0 access_token or incoming webhook token
    OAuth2:
      type: oauth2
      description: OAuth 2.0 authorization
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.bitrix.info/oauth/authorize/
          tokenUrl: https://oauth.bitrix.info/oauth/token/
          scopes:
            crm: CRM — leads, deals, contacts, companies, smart processes
            task: Tasks and projects
            disk: Drive — files and folders
            im: Chats and notifications
            imbot: Chatbots
            imopenlines: Open Lines — messenger connectors
            telephony: Telephony
            sale: E-Commerce — orders, shipments
            catalog: Trade Catalog — products, prices
            calendar: Calendar
            bizproc: Business processes and robots
            user: Users
            department: Company structure
            timeman: Time tracking
            landing: Sites and landing pages
            pay_system: Payment systems
            cashbox: Online cash registers
            delivery: Delivery services
            documentgenerator: Document generator
            lists: Universal lists
            entity: Data storage
            log: News feed
            sonet_group: Workgroups and projects
            mailservice: Mail services
            messageservice: Message providers (SMS)
            biconnector: BIconnector — BI analytics
            ai_admin: CoPilot / AI
            sign.b2e: Signature — e-document signing
            vote: Polls and voting
            booking: Online booking
            userconsent: User consent agreements
            userfieldconfig: Custom field settings
            basic: Basic access
            placement: Widget placements
            rpa: Robots process automation
            sonet: Social network
            intranet: Intranet
            socialnetwork: Social network
            workgroups: Workgroups
            salescenter: Sales center
            main: Main module
            imconnector: IM connector
            user.userfield: User custom fields
            user_basic: Basic user access
            userfieldconfig, module scope: Custom field config
externalDocs:
  description: Official Bitrix24 REST API Documentation
  url: https://apidocs.bitrix24.com
