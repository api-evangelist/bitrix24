                  description: '| `''SEND''` | ||'
                JS_PARAM:
                  type: string
                  description: '| `''/help''` | ||'
                HASH:
                  type: string
                  description: '| `''register''` | Token for accessing your frame, 32 characters ||'
                ICON_FILE:
                  type: string
                  description: '| `''/* base64 image */''` | Icon of your application - base64 ||'
                CONTEXT:
                  type: string
                  description: '| `''BOT''` | Application context ||'
                EXTRANET_SUPPORT:
                  type: string
                  description: '| `''N''` | Is the command available to extranet users, default N ||'
                LIVECHAT_SUPPORT:
                  type: string
                  description: '| `''N''` | Online chat support ||'
