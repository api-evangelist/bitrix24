          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                ID:
                  type: array
                  items: {}
                  description: '| An array of department IDs. You can pass a string with a JSON array of IDs.'
                USER_DATA:
                  type: string
                  description: '| Return detailed user data.'
              required:
