                  description: '| `13` | Chat identifier ||'
                IFRAME:
                  type: string
                  description: '| `''https://marta.bitrix.com/iframe/echo.php''` | URL of the frame ||'
                IFRAME_WIDTH:
                  type: string
                  description: '| `''350''` | Desired width of the frame. Minimum value - 250px ||'
                IFRAME_HEIGHT:
                  type: string
                  description: '| `''150''` | Desired height of the frame. Minimum value - 50px ||'
