        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                CHAT_ID:
                  type: integer
                  description: '| Identifier of the chat.'
                USERS:
                  type: array
                  items: {}
                  description: '| Array of user identifiers to be added to the chat.'
                HIDE_HISTORY:
                  type: string
                  description: '| Hide chat history for added users:'
              required:
              - CHAT_ID
              - USERS
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CHAT_ID:
                  type: integer
                  description: '| Identifier of the chat.'
                USERS:
                  type: array
                  items: {}
