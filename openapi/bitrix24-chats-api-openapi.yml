            schema:
              type: object
              properties:
                CHAT_ID:
                  type: integer
                  description: '| Identifier of the chat.'
                COLOR:
                  type: string
                  description: '| Chat color for the mobile application. Possible values:'
              required:
              - CHAT_ID
              - COLOR
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CHAT_ID:
                  type: integer
