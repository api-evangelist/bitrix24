                  description: '| Identifier of the chat.'
                USER_ID:
                  type: integer
                  description: '| Identifier of the new chat owner.'
              required:
              - CHAT_ID
              - USER_ID
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                CHAT_ID:
                  type: integer
                  description: '| Identifier of the chat.'
                USER_ID:
                  type: integer
                  description: '| Identifier of the new chat owner.'
              required:
              - CHAT_ID
              - USER_ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
