openapi: 3.2.0
info:
  title: Bitrix24 REST E Commerce API
  version: 1.0.0
  description: 'Bitrix24 REST API provides access to CRM, tasks, drive, chats, telephony, e-commerce, automation, and other modules. Documentation: https://apidocs.bitrix24.com'
  contact:
    name: Bitrix24 Developer Support
    url: https://apidocs.bitrix24.com/support.html
  license:
    name: MIT
    url: https://github.com/bitrix-tools/b24-rest-docs/blob/main/LICENSE
  x-logo:
    url: https://apidocs.bitrix24.com/_images/bitrix24logo.svg
servers:
- url: https://{portal}.bitrix24.com/rest
  description: Your Bitrix24 portal (cloud)
  variables:
    portal:
      default: your-portal
      description: Subdomain of your Bitrix24 portal
- url: https://{host}/rest
  description: On-Premise Bitrix24 installation
  variables:
    host:
      default: your-bitrix24.example.com
      description: Host of your on-premise installation
security:
- AccessToken: []
tags:
- name: Ecommerce
paths:
  /sale.basketitem.add:
    post:
      summary: Add a Custom Item to an Order Cart sale.basketitem.add
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.add` adds an item to the cart of an existing order.'
      operationId: sale_basketitem_add
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-add.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Field values of the cart item (detailed description) ||'
                orderId:
                  type: string
                  description: '| Order identifier ||'
                sort:
                  type: integer
                  description: '| Position in the list of order items. Default is `100` ||'
                productId:
                  type: string
                  description: '| Identifier of a product or variation from the catalog.'
                price:
                  type: number
                  format: double
                  description: '| Unit price including markups and discounts.'
                basePrice:
                  type: number
                  format: double
                  description: '| Original price excluding markups and discounts. For a catalog product, it is taken from the catalog by default. For a custom item without `basePrice`, the field is `0`, even if `price` is passed ||'
                discountPrice:
                  type: number
                  format: double
                  description: '| Amount of the final discount or markup. If you pass `price`, `basePrice`, and `discountPrice` yourself, keep the condition `basePrice = price + discountPrice` ||'
                currency:
                  type: string
                  description: '| Currency of the price. Must match the currency of the order, otherwise the method returns the `200140400011` error. The order currency is returned by the sale.order.get method ||'
                quantity:
                  type: number
                  format: double
                  description: '| Quantity of the product ||'
                xmlId:
                  type: string
                  description: '| External code of the cart item. If you do not pass it, Bitrix24 generates a code like `bx_6ab9ff3cc2d0a` ||'
              required:
              - fields
              - orderId
              - productId
              - currency
              - quantity
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Field values of the cart item (detailed description) ||'
                orderId:
                  type: string
                  description: '| Order identifier ||'
                sort:
                  type: integer
                  description: '| Position in the list of order items. Default is `100` ||'
                productId:
                  type: string
                  description: '| Identifier of a product or variation from the catalog.'
                price:
                  type: number
                  format: double
                  description: '| Unit price including markups and discounts.'
                basePrice:
                  type: number
                  format: double
                  description: '| Original price excluding markups and discounts. For a catalog product, it is taken from the catalog by default. For a custom item without `basePrice`, the field is `0`, even if `price` is passed ||'
                discountPrice:
                  type: number
                  format: double
                  description: '| Amount of the final discount or markup. If you pass `price`, `basePrice`, and `discountPrice` yourself, keep the condition `basePrice = price + discountPrice` ||'
                currency:
                  type: string
                  description: '| Currency of the price. Must match the currency of the order, otherwise the method returns the `200140400011` error. The order currency is returned by the sale.order.get method ||'
                quantity:
                  type: number
                  format: double
                  description: '| Quantity of the product ||'
                xmlId:
                  type: string
                  description: '| External code of the cart item. If you do not pass it, Bitrix24 generates a code like `bx_6ab9ff3cc2d0a` ||'
              required:
              - fields
              - orderId
              - productId
              - currency
              - quantity
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.addCatalogProduct:
    post:
      summary: Add a Catalog Product Item to an Order Cart sale.basketitem.addCatalogProduct
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.addCatalogProduct` adds a position (item) with a product or service from the catalog module to the cart of an existing order.'
      operationId: sale_basketitem_addCatalogProduct
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-add-catalog-product.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Field values for creating a cart item in the order (detailed description) ||'
                orderId:
                  type: string
                  description: '| Order identifier. It cannot be changed after the item is created.'
                productId:
                  type: string
                  description: '| Identifier of a product, service, or variation from the catalog. It cannot be changed after the item is created.'
                quantity:
                  type: number
                  format: double
                  description: '| Quantity of the product. Pass a value greater than `0`: with `0`, the method creates an item with no price and no name. You can pass a fractional number, for example `1.5` ||'
                currency:
                  type: string
                  description: '| Currency of the price, for example `USD`. Must match the currency of the order, otherwise the method returns the `200140400011` error. It cannot be changed after the item is created ||'
                price:
                  type: number
                  format: double
                  description: '| Unit price including discounts and markups.'
                sort:
                  type: integer
                  description: '| Position in the order item list. Default is `100` ||'
                xmlId:
                  type: string
                  description: '| External code of the cart item. If not passed, Bitrix24 generates the code itself, for example `bx_662675fba6516` ||'
              required:
              - fields
              - orderId
              - productId
              - quantity
              - currency
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                fields:
                  type: object
                  description: '| Field values for creating a cart item in the order (detailed description) ||'
                orderId:
                  type: string
                  description: '| Order identifier. It cannot be changed after the item is created.'
                productId:
                  type: string
                  description: '| Identifier of a product, service, or variation from the catalog. It cannot be changed after the item is created.'
                quantity:
                  type: number
                  format: double
                  description: '| Quantity of the product. Pass a value greater than `0`: with `0`, the method creates an item with no price and no name. You can pass a fractional number, for example `1.5` ||'
                currency:
                  type: string
                  description: '| Currency of the price, for example `USD`. Must match the currency of the order, otherwise the method returns the `200140400011` error. It cannot be changed after the item is created ||'
                price:
                  type: number
                  format: double
                  description: '| Unit price including discounts and markups.'
                sort:
                  type: integer
                  description: '| Position in the order item list. Default is `100` ||'
                xmlId:
                  type: string
                  description: '| External code of the cart item. If not passed, Bitrix24 generates the code itself, for example `bx_662675fba6516` ||'
              required:
              - fields
              - orderId
              - productId
              - quantity
              - currency
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.delete:
    post:
      summary: Remove an Item from an Order Cart sale.basketitem.delete
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.delete` removes a cart item from an order. After the removal, the order total is recalculated. If you remove the last item, the order is left with no items and a total of `0`.'
      operationId: sale_basketitem_delete
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-delete.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: '| Identifier of the cart item.'
              required:
              - id
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: '| Identifier of the cart item.'
              required:
              - id
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.get:
