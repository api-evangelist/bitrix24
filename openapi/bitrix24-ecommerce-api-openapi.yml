              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.getFields:
    post:
      summary: Get Cart Item Fields sale.basketitem.getFields
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.getFields` returns a list of available fields of the cart item. Each field is described as a field settings structure rest_field_description.'
      operationId: sale_basketitem_getFields
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-get-fields.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response ||'
                basketItem:
                  type: object
                  description: '| Object in the format `{"field_1": "value_1", ... "field_N": "value_N"}`, where `field` is the identifier of the object sale_basket_item, and `value` is an object of type rest_field_description'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
                Code:
                  type: string
                  description: '| Description ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response ||'
                basketItem:
                  type: object
                  description: '| Object in the format `{"field_1": "value_1", ... "field_N": "value_N"}`, where `field` is the identifier of the object sale_basket_item, and `value` is an object of type rest_field_description'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
                Code:
                  type: string
                  description: '| Description ||'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.getFieldsCatalogProduct:
    post:
      summary: Get Catalog Product Item Fields sale.basketitem.getFieldsCatalogProduct
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.getFieldsCatalogProduct` retrieves a list of cart item fields for the methods sale.basketitem.addCatalogProduct and sale.basketitem.updateCatalogProduct — these methods only work with products from the catalog module.'
      operationId: sale_basketitem_getFieldsCatalogProduct
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-get-catalog-product-fields.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response ||'
                basketItem:
                  type: object
                  description: '| Object in the format `{"field_1": "value_1", ... "field_N": "value_N"}`, where `field` is the identifier of the field of the sale_basket_item, and `value` is an object of type rest_field_description'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
                Code:
                  type: string
                  description: '| Description ||'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                result:
                  type: object
                  description: '| Root element of the response ||'
                basketItem:
                  type: object
                  description: '| Object in the format `{"field_1": "value_1", ... "field_N": "value_N"}`, where `field` is the identifier of the field of the sale_basket_item, and `value` is an object of type rest_field_description'
                time:
                  type: string
                  description: '| Information about the request execution time ||'
                Code:
                  type: string
                  description: '| Description ||'
      responses:
