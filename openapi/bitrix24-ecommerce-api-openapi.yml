              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.list:
    post:
      summary: Get a List of Cart Items sale.basketitem.list
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.list` retrieves a list of cart items that match the filter.'
      operationId: sale_basketitem_list
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-list.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                select:
                  type: array
                  items: {}
                  description: '|'
                filter:
                  type: object
                  description: '| An object for filtering the selected records in the format `{"field_1": "value_1", ... "field_N": "value_N"}`.'
                order:
                  type: object
                  description: '|'
                start:
                  type: integer
                  description: '| This parameter is used to manage pagination.'
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                select:
                  type: array
                  items: {}
                  description: '|'
                filter:
                  type: object
                  description: '| An object for filtering the selected records in the format `{"field_1": "value_1", ... "field_N": "value_N"}`.'
                order:
                  type: object
                  description: '|'
                start:
                  type: integer
                  description: '| This parameter is used to manage pagination.'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.update:
    post:
      summary: Update an Order Cart Item sale.basketitem.update
      description: 'Choose a tool for developing with an AI agent: - use Alaio Vibecode to build an app for Bitrix24 from a task description without knowing any programming language. The agent writes the code and deploys the app to a server, with no manual hosting setup - use the MCP server to develop a REST API integration in your own project. The agent refers to the official REST documentation The method `sale.basketitem.update` modifies a cart item in an existing order. After the quantity or price changes, Bitrix24 recalculates the order total.'
      operationId: sale_basketitem_update
      tags:
      - Ecommerce
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/sale/basket-item/sale-basket-item-update.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: '| Identifier of the cart item. You can retrieve cart item identifiers using the method sale.basketitem.list ||'
                fields:
                  type: object
                  description: '| Values of the fields to be modified (detailed description) ||'
                quantity:
                  type: number
                  format: double
                  description: '| Quantity of the product. Pass it in every call, even if the quantity does not change, otherwise the method returns the error `Required fields: quantity`.'
                sort:
                  type: integer
                  description: '| Position in the list of cart items ||'
                price:
                  type: number
                  format: double
                  description: '| Price including markups and discounts. If you pass a price, Bitrix24 sets `customPrice` = `Y` for the item — the price is considered manually set and is no longer taken from the catalog ||'
                basePrice:
                  type: number
                  format: double
                  description: '| Original price excluding markups and discounts. Pass it together with `price` and `discountPrice` so that `basePrice = price + discountPrice` holds ||'
                discountPrice:
                  type: number
                  format: double
                  description: '| Amount of the final discount or markup. For a markup, the value is negative ||'
                xmlId:
                  type: string
                  description: '| External code of the cart item ||'
                name:
                  type: string
                  description: '| Name of the product ||'
                weight:
                  type: number
                  format: double
                  description: '| Weight of the product. A cart item from the catalog receives the value of the product''s `weight` field without conversion, so pass the weight in the same units as in the catalog ||'
                dimensions:
                  type: string
                  description: '| Dimensions of the product — a string with a PHP-serialized array with the keys `WIDTH`, `HEIGHT`, and `LENGTH`, for example `a:3:{s:5:"WIDTH";i:244;s:6:"HEIGHT";i:100;s:6:"LENGTH";i:31;}`. Cart items added from the catalog store dimensions in this form.'
                measureCode:
                  type: string
                  description: '| Code of the product''s unit of measure ||'
                measureName:
                  type: string
                  description: '| Name of the unit of measure ||'
                canBuy:
                  type: string
                  description: '| Availability flag of the product. Possible values:'
                vatRate:
                  type: number
                  format: double
                  description: '| Tax rate as a fraction of one: `0.1` means 10 %. For the "No VAT" rate, pass an empty string; the response contains `null` ||'
                vatIncluded:
                  type: string
                  description: '| Flag indicating whether VAT or tax is included in the product price. Possible values:'
              required:
              - id
              - fields
              - quantity
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: '| Identifier of the cart item. You can retrieve cart item identifiers using the method sale.basketitem.list ||'
                fields:
                  type: object
                  description: '| Values of the fields to be modified (detailed description) ||'
                quantity:
                  type: number
                  format: double
                  description: '| Quantity of the product. Pass it in every call, even if the quantity does not change, otherwise the method returns the error `Required fields: quantity`.'
                sort:
                  type: integer
                  description: '| Position in the list of cart items ||'
                price:
                  type: number
                  format: double
                  description: '| Price including markups and discounts. If you pass a price, Bitrix24 sets `customPrice` = `Y` for the item — the price is considered manually set and is no longer taken from the catalog ||'
                basePrice:
                  type: number
                  format: double
                  description: '| Original price excluding markups and discounts. Pass it together with `price` and `discountPrice` so that `basePrice = price + discountPrice` holds ||'
                discountPrice:
                  type: number
                  format: double
                  description: '| Amount of the final discount or markup. For a markup, the value is negative ||'
                xmlId:
                  type: string
                  description: '| External code of the cart item ||'
                name:
                  type: string
                  description: '| Name of the product ||'
                weight:
                  type: number
                  format: double
                  description: '| Weight of the product. A cart item from the catalog receives the value of the product''s `weight` field without conversion, so pass the weight in the same units as in the catalog ||'
                dimensions:
                  type: string
                  description: '| Dimensions of the product — a string with a PHP-serialized array with the keys `WIDTH`, `HEIGHT`, and `LENGTH`, for example `a:3:{s:5:"WIDTH";i:244;s:6:"HEIGHT";i:100;s:6:"LENGTH";i:31;}`. Cart items added from the catalog store dimensions in this form.'
                measureCode:
                  type: string
                  description: '| Code of the product''s unit of measure ||'
                measureName:
                  type: string
                  description: '| Name of the unit of measure ||'
                canBuy:
                  type: string
                  description: '| Availability flag of the product. Possible values:'
                vatRate:
                  type: number
                  format: double
                  description: '| Tax rate as a fraction of one: `0.1` means 10 %. For the "No VAT" rate, pass an empty string; the response contains `null` ||'
                vatIncluded:
                  type: string
                  description: '| Flag indicating whether VAT or tax is included in the product price. Possible values:'
              required:
              - id
              - fields
              - quantity
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - sale
  /sale.basketitem.updateCatalogProduct:
    post:
      summary: Update a Catalog Product Item sale.basketitem.updateCatalogProduct
