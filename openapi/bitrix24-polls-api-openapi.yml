      tags:
      - Polls
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/vote/vote.attachedvote.get.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                attachId:
                  type: integer
                  description: '| ID of the attached vote, can be equal to `voteId` from the results of vote.Integration.Im.send ||'
                moduleId:
                  type: string
                  description: '| Module ID, possible values:'
                entityType:
                  type: string
                  description: '| Object type, possible values:'
                entityId:
                  type: integer
                  description: '| Element ID, possible values:'
                signedAttachId:
                  type: string
                  description: '| Signed attachment ID, can be obtained using the method vote.AttachedVote.get, response parameter `signedAttachId` ||'
              required:
              - attachId
              - moduleId
              - entityType
              - entityId
              - signedAttachId
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                attachId:
                  type: integer
                  description: '| ID of the attached vote, can be equal to `voteId` from the results of vote.Integration.Im.send ||'
                moduleId:
                  type: string
                  description: '| Module ID, possible values:'
                entityType:
                  type: string
                  description: '| Object type, possible values:'
                entityId:
                  type: integer
                  description: '| Element ID, possible values:'
                signedAttachId:
                  type: string
                  description: '| Signed attachment ID, can be obtained using the method vote.AttachedVote.get, response parameter `signedAttachId` ||'
              required:
              - attachId
              - moduleId
              - entityType
              - entityId
              - signedAttachId
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - vote
