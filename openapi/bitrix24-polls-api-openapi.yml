    post:
      summary: Create and Send a Vote in Chat vote.Integration.Im.send
      description: If you are developing integrations for Bitrix24 using AI tools (Codex, Claude Code, Cursor), connect to the [MCP server](../../ai-tools/mcp.md) so that the assistant can utilize the official REST documentation. The method `vote.Integration.Im.send` creates and sends a vote to the specified chat in the messenger.
      operationId: vote_Integration_Im_send
      tags:
      - Polls
      externalDocs:
        url: https://apidocs.bitrix24.com/api-reference/vote/vote.integration.im.send.html
        description: Official Documentation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                chatId:
                  type: integer
                  description: '| The identifier of the chat to which the vote is sent. It can be obtained using the methods im.chat.add, im.chat.get, im.recent.get, im.recent.list ||'
                IM_MESSAGE_VOTE_DATA:
                  type: object
                  description: '| Vote data containing the question and answer options. The structure is described below ||'
                templateId:
                  type: string
                  description: '| A unique identifier for the request, with no format requirements. The purpose of the identifier is to prevent duplication. If the request is sent again due to a network failure with the same `templateId`, the server will recognize this and create the vote only once ||'
                QUESTIONS:
                  type: array
                  items: {}
                  description: '| An array of vote questions, the structure is described below. Maximum 1 question ||'
                ANONYMITY:
                  type: integer
                  description: '| Anonymity of the vote. Possible values:'
                OPTIONS:
                  type: integer
                  description: '| Allow re-voting. Possible values:'
                QUESTION:
                  type: string
                  description: '| The text of the question ||'
                FIELD_TYPE:
                  type: integer
                  description: '| The type of field for the answer. Possible values:'
                ANSWERS:
                  type: array
                  items: {}
                  description: '| An array of answer options, the structure is described below. Minimum 2 options, maximum 10 ||'
                MESSAGE:
                  type: string
                  description: '| The text of the answer option ||'
              required:
              - chatId
              - IM_MESSAGE_VOTE_DATA
              - QUESTIONS
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                chatId:
                  type: integer
                  description: '| The identifier of the chat to which the vote is sent. It can be obtained using the methods im.chat.add, im.chat.get, im.recent.get, im.recent.list ||'
                IM_MESSAGE_VOTE_DATA:
                  type: object
                  description: '| Vote data containing the question and answer options. The structure is described below ||'
                templateId:
                  type: string
                  description: '| A unique identifier for the request, with no format requirements. The purpose of the identifier is to prevent duplication. If the request is sent again due to a network failure with the same `templateId`, the server will recognize this and create the vote only once ||'
                QUESTIONS:
                  type: array
                  items: {}
                  description: '| An array of vote questions, the structure is described below. Maximum 1 question ||'
                ANONYMITY:
                  type: integer
                  description: '| Anonymity of the vote. Possible values:'
                OPTIONS:
                  type: integer
                  description: '| Allow re-voting. Possible values:'
                QUESTION:
                  type: string
                  description: '| The text of the question ||'
                FIELD_TYPE:
                  type: integer
                  description: '| The type of field for the answer. Possible values:'
                ANSWERS:
                  type: array
                  items: {}
                  description: '| An array of answer options, the structure is described below. Minimum 2 options, maximum 10 ||'
                MESSAGE:
                  type: string
                  description: '| The text of the answer option ||'
              required:
              - chatId
              - IM_MESSAGE_VOTE_DATA
              - QUESTIONS
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixResponse'
        4XX:
          description: Request error (400, 401, 403)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitrixError'
      security:
      - AccessToken: []
      - OAuth2:
        - vote
components:
  schemas:
    BitrixError:
      type: object
      description: Bitrix24 REST API error response
      required:
      - error
      - error_description
      properties:
        error:
          type: string
          description: Error code
          example: ACCESS_DENIED
        error_description:
          type: string
          description: Human-readable error description
          example: Access denied.
    BitrixTime:
      type: object
      description: Request execution time information
      properties:
        start:
          type: number
          format: double
        finish:
