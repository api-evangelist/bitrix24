- aid: bitrix24:rest-api
  name: Bitrix24 REST API
  description: >-
    Tenant-scoped REST API for managing CRM entities, deals, leads, tasks, calendars, telephony, disk
    files, users, and marketplace apps. Each request targets the customer's portal URL of the form https://{portal}.bitrix24.com/rest/
    and authenticates via an inbound webhook secret or an OAuth 2.0 access token.
  humanURL: https://apidocs.bitrix24.com/
  baseURL: https://{installation}.bitrix24.com/rest/
